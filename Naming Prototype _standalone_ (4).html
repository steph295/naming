document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ibility-note { background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:10px 12px; font-size:12px; color:#374151; line-height:1.5; margin-top:14px; display:flex; gap:8px; }\n.eligibility-note svg { width:14px; height:14px; stroke:#6b7280; fill:none; stroke-width:2; flex-shrink:0; margin-top:2px; }\n\n/* Horse picker */\n.horse-pick-list { display:flex; flex-direction:column; gap:8px; }\n.horse-pick-row { display:flex; align-items:center; gap:12px; border:1px solid #e5e7eb; border-radius:8px; padding:12px 14px; cursor:pointer; background:white; transition:border-color 0.12s, background 0.12s; }\n.horse-pick-row:hover { border-color:#c0c5ce; }\n.horse-pick-row.selected { border-color:#BE1337; background:#fefbfb; box-shadow:0 0 0 3px rgba(190,19,55,0.06); }\n.horse-pick-row input[type=radio] { margin:0; flex-shrink:0; accent-color:#BE1337; }\n.horse-pick-row.disabled { cursor:not-allowed; background:#fafbfc; opacity:0.82; }\n.horse-pick-row.disabled .horse-pick-name { color:#6b7280; }\n.horse-pick-info { flex:1; min-width:0; }\n.horse-pick-name { font-size:13px; font-weight:600; color:#1a1a2e; margin-bottom:2px; }\n.horse-pick-meta { font-size:11.5px; color:#6b7280; line-height:1.45; }\n.horse-pick-meta .sep { color:#d1d5db; margin:0 6px; }\n.horse-pick-status { display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500; padding:5px 9px; border-radius:14px; white-space:nowrap; flex-shrink:0; }\n.horse-pick-status svg { width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.4; }\n.horse-pick-status.ok { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }\n.horse-pick-status.bad { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }\n.horse-pick-section-label { font-size:11px; color:#9ca3af; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin:14px 0 8px; }\n.horse-pick-section-label:first-child { margin-top:0; }\n\n/* \"Can't find your horse?\" lookup block */\n.horse-lookup { mar tton class=\"btn-back\" onclick=\"go('screen-reg2')\">Back<\u002Fbutton><button class=\"btn-primary\" onclick=\"go('screen-reg4')\">Continue<\u002Fbutton><\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"screen\" id=\"screen-reg4\">\n  <div class=\"subnav\"><a onclick=\"openAbandon('screen-table')\">Horse names<\u002Fa><a class=\"active\" onclick=\"openAbandon('screen-avail')\">Search for Name<\u002Fa><\u002Fdiv>\n  <div class=\"flow-body\">\n    <aside>\n      <div class=\"stepper-label\">Register horse name<\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Horse details<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Your Details<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Review<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot active\">4<\u002Fdiv><\u002Fdiv><div class=\"step-text active\">Payment<\u002Fdiv><\u002Fdiv>\n    <\u002Faside>\n    <main>\n      <h2>Payment<\u002Fh2>\n      <div class=\"card\"><h3>Registration summary<\u002Fh3>\n        <div class=\"review-row\"><span class=\"lbl\">Horse name<\u002Fspan><span class=\"val\">Larry Long Legs<\u002Fspan><\u002Fdiv>\n        <div class=\"review-row\"><span class=\"lbl\">Horse passport<\u002Fspan><span class=\"val\">8260GB45901990T<\u002Fspan><\u002Fdiv>\n        <div class=\"review-row\"><span class=\"lbl\">Registered to<\u002Fspan><span class=\"val\">John Smith (Sole Owner)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\"><h3>Cost breakdown<\u002Fh3>\n        <div class=\"summary-row\"><span class=\"lbl\">Name registration<\u002Fspan><span class=\"val\">£50.00<\u002Fspan><\u002Fdiv>\n        <div class=\"summary-row\"><span class=\"lbl\">VAT (20%)<\u002Fspan><span class=\"val\">£10.00<\u002Fspan><\u002Fdiv>\n        <hr class=\"divider\">\n        <div class=\"summary-row total\"><span class=\"lbl\">Total<\u002Fspan><span class=\"val\">£60.00<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\"><h3>Payment method<\u002Fh3>\n        <label class=\"radio-row\" onclick=\"selPay('reg','acct')\"><input type=\"radio\" name=\"reg-pay\" checked=\"\"><div style=\"width:100%\"><div class=\"rl\">Charge to existing account<\u002Fdiv><div class=\"sub-panel open\" id=\"reg-pay-acct\"><div class=\"pay-acct-panel\" data-pay-acct=\"reg\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Flabel>\n        <label class=\"radio-row\" onclick=\"selPay('reg','dd')\"><input type=\"radio\" name=\"reg-pay\"><div style=\"width:100%\"><div class=\"rl\">Set up Direct Debit<\u002Fdiv><div class=\"sub-panel\" id=\"reg-pay-dd\"><div class=\"field\"><label>Sort code<\u002Flabel><input type=\"text\" placeholder=\"00-00-00\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Flabel>\n        <label class=\"radio-row\" onclick=\"selPay('reg','card')\"><input type=\"radio\" name=\"reg-pay\"><div style=\"width:100%\"><div class=\"rl\">Pay by card<\u002Fdiv><div class=\"sub-panel\" id=\"reg-pay-card\"><div class=\"card-icons\"><span class=\"card-icon\">Visa<\u002Fspan><span class=\"card-icon\">Mastercard<\u002Fspan><\u002Fdiv><div class=\"field\"><label>Card number<\u002Flabel><input type=\"text\" placeholder=\"1234 5678 9012 3456\"><\u002Fdiv><div class=\"form-row\"><div class=\"field\"><label>Expiry<\u002Flabel><input type=\"text\" placeholder=\"MM / YY\"><\u002Fdiv><div class=\"field\"><label>CVC<\u002Flabel><input type=\"text\" placeholder=\"123\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"actions\"><button class=\"btn-back\" onclick=\"go('screen-reg3')\">Back<\u002Fbutton><button class=\"btn-primary\" onclick=\"go('screen-reg-success')\">Complete payment<\u002Fbutton><\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"screen\" id=\"screen-reg-success\">\n  <div class=\"flow-bar\"><button class=\"back-btn\" style=\"visibility:hidden\">x<\u002Fbutton><\u002Fdiv>\n  <div class=\"success-outer\">\n    <div class=\"success-inner\">\n      <div class=\"success-card\">\n        <div class=\"success-icon\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n        <h1>Registration submitted<\u002Fh1>\n        <p>Your name registration for <strong>Larry Long Legs<\u002Fstrong> has been submitted and is pending approval. You'll receive a confirmation by email shortly.<\u002Fp>\n        <div class=\"ref-box\"><span class=\"ref-lbl\">Reference<\u002Fspan><span class=\"ref-num\">NR-2026-091234<\u002Fspan><\u002Fdiv>\n        <div class=\"info-box\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg><p>You'll be notified by email once Weatherbys have reviewed your application. You can track its status from <strong>My Names<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n        <div class=\"success-btns\"><button class=\"btn-primary\" onclick=\"go('screen-table')\">Go to My Names<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ==================== CHANGE OF NAME FLOW ==================== -->\n\n<!-- Step 0: Eligibility + horse picker -->\n<div class=\"screen\" id=\"screen-con-pick\">\n  <div class=\"flow-bar\"><button class=\"back-btn\" onclick=\"go('screen-table')\"><svg viewBox=\"0 0 24 24\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>Back to My Names<\u002Fbutton><\u002Fdiv>\n  <div class=\"flow-body\">\n    <aside>\n      <div class=\"stepper-label\">Change of name<\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot active\">1<\u002Fdiv><div class=\"step-line\"><\u002Fdiv><\u002Fdiv><div class=\"step-text active\">Choose horse<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot inactive\">2<\u002Fdiv><div class=\"step-line\"><\u002Fdiv><\u002Fdiv><div class=\"step-text inactive\">Proposed name<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot inactive\">3<\u002Fdiv><div class=\"step-line\"><\u002Fdiv><\u002Fdiv><div class=\"step-text inactive\">Label address<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot inactive\">4<\u002Fdiv><\u002Fdiv><div class=\"step-text inactive\">Payment<\u002Fdiv><\u002Fdiv>\n    <\u002Faside>\n    <main>\n      <h2>Change of name<\u002Fh2>\n      <p class=\"page-sub\">A change of name is a one-off application for a horse that meets the eligibility criteria below. A £60 fee (inc. VAT) applies on submission. Approval is at Weatherbys' discretion.<\u002Fp>\n\n      <div class=\"card\">\n        <h3>Eligibility criteria<\u002Fh3>\n        <ul class=\"eligibility-list\">\n          <li>\n            <svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <div><strong>The horse has not yet started in a race.<\u002Fstrong><span class=\"e-sub\">Once a horse has raced under its name — flat, jumps, or point-to-point — the name becomes part of its record and cannot be changed.<\u002Fspan><\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <div><strong>The horse has a currently registered name.<\u002Fstrong><span class=\"e-sub\">Unnamed horses and reservations that haven't been registered to a horse don't qualify — register the name first, or pick a new one.<\u002Fspan><\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <div><strong>You are the registered owner.<\u002Fstrong><span class=\"e-sub\">For shared ownership, written consent from every co-owner must be obtained before the new name is approved.<\u002Fspan><\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n        <div class=\"eligibility-note\">\n          <svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n          <div>The new name must pass the same checks as a new registration: 18 characters max, no commercial or offensive content, and no clash with famous persons or existing names.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <h3>Choose a horse<\u002Fh3>\n        <p class=\"page-sub\" style=\"margin-bottom:14px\">Showing all horses registered under your ownership — including those acquired with a name you didn't apply for yourself.<\u002Fp>\n\n        <div class=\"horse-pick-section-label\">Eligible<\u002Fdiv>\n        <div class=\"horse-pick-list\" id=\"horse-pick-list-ok\"><\u002Fdiv>\n\n        <div class=\"horse-pick-section-label\">Not eligible<\u002Fdiv>\n        <div class=\"horse-pick-list\" id=\"horse-pick-list-bad\"><\u002Fdiv>\n\n        <div class=\"horse-lookup\">\n          <div class=\"horse-lookup-summary\" id=\"horse-lookup-summary\" onclick=\"toggleHorseLookup()\">\n            <div>\n              <div class=\"horse-lookup-title\">Can't find your horse?<\u002Fdiv>\n              <div class=\"horse-lookup-sub\">Horses not currently linked to your Racing Digital account — e.g. recently transferred, registered with another agent, or never registered — can be added by their passport details.<\u002Fdiv>\n            <\u002Fdiv>\n            <svg class=\"horse-lookup-chev\" viewBox=\"0 0 24 24\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"horse-lookup-body\" id=\"horse-lookup-body\" hidden=\"\">\n            <div class=\"horse-lookup-grid\">\n              <div>\n                <label>Passport number<\u002Flabel>\n                <input type=\"text\" id=\"lookup-passport\" placeholder=\"e.g. GBR40123456\">\n              <\u002Fdiv>\n              <div>\n                <label>Microchip / UELN <span class=\"optional\">(optional)<\u002Fspan><\u002Flabel>\n                <input type=\"text\" id=\"lookup-microchip\" placeholder=\"15-digit microchip or UELN\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"horse-lookup-actions\">\n              <button type=\"button\" class=\"btn-back\" onclick=\"toggleHorseLookup()\">Cancel<\u002Fbutton>\n              <button type=\"button\" class=\"btn-primary\" id=\"btn-horse-lookup\" onclick=\"lookupHorse()\">Find horse<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"horse-lookup-result\" id=\"horse-lookup-result\" hidden=\"\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"actions\">\n        <button class=\"btn-back\" onclick=\"go('screen-table')\">Cancel<\u002Fbutton>\n        <button class=\"btn-primary\" id=\"btn-con-pick\" disabled=\"\" onclick=\"confirmConPick()\">Continue<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"screen\" id=\"screen-con1\">\n  <div class=\"flow-bar\"><button class=\"back-btn\" onclick=\"openAbandon('screen-con-pick')\"><svg viewBox=\"0 0 24 24\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>Back to choose horse<\u002Fbutton><\u002Fdiv>\n  <div class=\"flow-body\">\n    <aside>\n      <div class=\"stepper-label\">Change of name<\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Choose horse<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot active\">2<\u002Fdiv><div class=\"step-line\"><\u002Fdiv><\u002Fdiv><div class=\"step-text active\">Proposed name<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot inactive\">3<\u002Fdiv><div class=\"step-line\"><\u002Fdiv><\u002Fdiv><div class=\"step-text inactive\">Label address<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot inactive\">4<\u002Fdiv><\u002Fdiv><div class=\"step-text inactive\">Payment<\u002Fdiv><\u002Fdiv>\n    <\u002Faside>\n    <main>\n      <div class=\"ctx-bar\">\n        <div class=\"ctx-item\"><div class=\"lbl\">Current name<\u002Fdiv><div class=\"val con-val-current\">Swift Justice<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Horse<\u002Fdiv><div class=\"val con-val-horse\">2024 gr Dubawi (IRE)<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Registered to<\u002Fdiv><div class=\"val con-val-owner\">John Smith (Sole Owner)<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Ref<\u002Fdiv><div class=\"val con-val-ref\">REF-2020-001<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <h2>Proposed name<\u002Fh2>\n      <p class=\"page-sub\">Check availability before continuing. Names must be 18 characters or fewer and contain only letters, apostrophes, or hyphens.<\u002Fp>\n      <div class=\"card\">\n        <div class=\"field\">\n          <label>Proposed name<\u002Flabel>\n          <div class=\"input-row\">\n            <input type=\"text\" id=\"con-name\" maxlength=\"18\" placeholder=\"Enter proposed name\" oninput=\"conNameInput(this.value)\">\n            <button class=\"find-btn\" onclick=\"conCheckAvail()\">Check availability<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"char-count\" id=\"con-char\">0 / 18 characters<\u002Fdiv>\n          <div class=\"status-msg\" id=\"con-avail\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>This name is available (subject to final review)<\u002Fdiv>\n          <div class=\"status-msg\" id=\"con-unavail\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg><span id=\"con-unavail-msg\">This name is not available.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <hr class=\"divider\">\n        <div class=\"field\"><label>Name meaning<\u002Flabel><div class=\"field-hint\">Explain what the name means or where it comes from. This helps the naming committee assess the application.<\u002Fdiv><textarea id=\"con-meaning\" placeholder=\"e.g. Named after my grandfather's farm in County Clare\" oninput=\"conCheck()\"><\u002Ftextarea><\u002Fdiv>\n        <div class=\"field\"><label>Pronunciation<\u002Flabel><div class=\"field-hint\">How is the name pronounced? Write it phonetically if helpful.<\u002Fdiv><input type=\"text\" id=\"con-pron\" placeholder=\"e.g. Swift AR-oh\" oninput=\"conCheck()\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"actions\"><button class=\"btn-primary\" id=\"btn-con1\" disabled=\"\" onclick=\"go('screen-con2')\">Next<\u002Fbutton><\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"screen\" id=\"screen-con2\">\n  <div class=\"flow-bar\"><button class=\"back-btn\" onclick=\"openAbandon('screen-table')\"><svg viewBox=\"0 0 24 24\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>Back to My Names<\u002Fbutton><\u002Fdiv>\n  <div class=\"flow-body\">\n    <aside>\n      <div class=\"stepper-label\">Change of name<\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Choose horse<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Proposed name<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot active\">3<\u002Fdiv><div class=\"step-line\"><\u002Fdiv><\u002Fdiv><div class=\"step-text active\">Label address<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot inactive\">4<\u002Fdiv><\u002Fdiv><div class=\"step-text inactive\">Payment<\u002Fdiv><\u002Fdiv>\n    <\u002Faside>\n    <main>\n      <div class=\"ctx-bar\">\n        <div class=\"ctx-item\"><div class=\"lbl\">Current name<\u002Fdiv><div class=\"val con-val-current\">Swift Justice<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Proposed name<\u002Fdiv><div class=\"val\" id=\"con-ctx-name\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Registered to<\u002Fdiv><div class=\"val con-val-owner\">John Smith (Sole Owner)<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Ref<\u002Fdiv><div class=\"val con-val-ref\">REF-2020-001<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <h2>Where should we send the name label?<\u002Fh2>\n      <p class=\"page-sub\">The approved name label will be posted to this address. It needs to be physically added to the horse's passport.<\u002Fp>\n      <div class=\"card\">\n        <label class=\"radio-row\" onclick=\"selConAddr('profile')\"><input type=\"radio\" name=\"con-addr\" checked=\"\"><div style=\"width:100%\"><div class=\"rl\">Use my profile address<\u002Fdiv><div class=\"addr-block\">123 Main Street<br>London<br>SW1A 1AA<\u002Fdiv><\u002Fdiv><\u002Flabel>\n        <label class=\"radio-row\" onclick=\"selConAddr('diff')\"><input type=\"radio\" name=\"con-addr\" id=\"con-addr-diff\"><div style=\"width:100%\"><div class=\"rl\">Use a different address<\u002Fdiv><div class=\"rh\">Enter an alternative postal address<\u002Fdiv>\n          <div class=\"addr-form\" id=\"con-addr-form\"><div class=\"field\"><label>Address line 1<\u002Flabel><input type=\"text\" placeholder=\"Street address\"><\u002Fdiv><div class=\"form-row\"><div class=\"field\"><label>Town / City<\u002Flabel><input type=\"text\" placeholder=\"Town or city\"><\u002Fdiv><div class=\"field\"><label>Postcode<\u002Flabel><input type=\"text\" placeholder=\"Postcode\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"actions\"><button class=\"btn-back\" onclick=\"go('screen-con1')\">Back<\u002Fbutton><button class=\"btn-primary\" onclick=\"go('screen-con3')\">Next<\u002Fbutton><\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"screen\" id=\"screen-con3\">\n  <div class=\"flow-bar\"><button class=\"back-btn\" onclick=\"openAbandon('screen-table')\"><svg viewBox=\"0 0 24 24\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>Back to My Names<\u002Fbutton><\u002Fdiv>\n  <div class=\"flow-body\">\n    <aside>\n      <div class=\"stepper-label\">Change of name<\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Choose horse<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Proposed name<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot done\">✓<\u002Fdiv><div class=\"step-line done\"><\u002Fdiv><\u002Fdiv><div class=\"step-text done\">Label address<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"step-col\"><div class=\"step-dot active\">4<\u002Fdiv><\u002Fdiv><div class=\"step-text active\">Payment<\u002Fdiv><\u002Fdiv>\n    <\u002Faside>\n    <main>\n      <div class=\"ctx-bar\">\n        <div class=\"ctx-item\"><div class=\"lbl\">Current name<\u002Fdiv><div class=\"val con-val-current\">Swift Justice<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Proposed name<\u002Fdiv><div class=\"val\" id=\"con-ctx-name2\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Registered to<\u002Fdiv><div class=\"val con-val-owner\">John Smith (Sole Owner)<\u002Fdiv><\u002Fdiv>\n        <div class=\"ctx-item\"><div class=\"lbl\">Ref<\u002Fdiv><div class=\"val con-val-ref\">REF-2020-001<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <h2>Payment<\u002Fh2>\n      <p class=\"page-sub\">A one-off fee applies for a change of name. Select how you would like to pay.<\u002Fp>\n      <div class=\"card\"><h3>Cost breakdown<\u002Fh3>\n        <div class=\"summary-row\"><span class=\"lbl\">Change of name fee<\u002Fspan><span class=\"val\">£50.00<\u002Fspan><\u002Fdiv>\n        <div class=\"summary-row\"><span class=\"lbl\">VAT (20%)<\u002Fspan><span class=\"val\">£10.00<\u002Fspan><\u002Fdiv>\n        <hr class=\"divider\">\n        <div class=\"summary-row total\"><span class=\"lbl\">Total<\u002Fspan><span class=\"val\">£60.00<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\"><h3>Payment method<\u002Fh3>\n        <label class=\"radio-row\" onclick=\"selPay('con','acct')\"><input type=\"radio\" name=\"con-pay\" checked=\"\"><div style=\"width:100%\"><div class=\"rl\">Charge to existing account<\u002Fdiv><div class=\"sub-panel open\" id=\"con-pay-acct\"><div class=\"pay-acct-panel\" data-pay-acct=\"con\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Flabel>\n        <label class=\"radio-row\" onclick=\"selPay('con','dd')\"><input type=\"radio\" name=\"con-pay\"><div style=\"width:100%\"><div class=\"rl\">Set up direct debit<\u002Fdiv><div class=\"sub-panel\" id=\"con-pay-dd\"><div class=\"field\"><label>Sort code<\u002Flabel><input type=\"text\" placeholder=\"00-00-00\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Flabel>\n        <label class=\"radio-row\" onclick=\"selPay('con','card')\"><input type=\"radio\" name=\"con-pay\"><div style=\"width:100%\"><div class=\"rl\">Pay by card<\u002Fdiv><div class=\"sub-panel\" id=\"con-pay-card\"><div class=\"card-icons\"><span class=\"card-icon\">Visa<\u002Fspan><span class=\"card-icon\">Mastercard<\u002Fspan><\u002Fdiv><div class=\"field\"><label>Card number<\u002Flabel><input type=\"text\" placeholder=\"1234 5678 9012 3456\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"actions\"><button class=\"btn-back\" onclick=\"go('screen-con2')\">Back<\u002Fbutton><button class=\"btn-primary\" onclick=\"go('screen-con-success')\">Submit application<\u002Fbutton><\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"screen\" id=\"screen-con-success\">\n  <div class=\"flow-bar\"><button class=\"back-btn\" style=\"visibility:hidden\">x<\u002Fbutton><\u002Fdiv>\n  <div class=\"success-outer\">\n    <div class=\"success-inner\">\n      <div class=\"success-card\">\n        <div class=\"success-icon\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n        <h1>Application submitted<\u002Fh1>\n        <p>Your change of name application for <strong class=\"con-val-current\">Swift Justice<\u002Fstrong> to <strong id=\"con-success-name\">—<\u002Fstrong> has been submitted and is pending review.<\u002Fp>\n        <div class=\"ref-box\"><span class=\"ref-lbl\">Reference<\u002Fspan><span class=\"ref-num\">CON-2026-091847<\u002Fspan><\u002Fdiv>\n        <div class=\"info-box\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg><p>You'll be notified by email once Weatherbys have reviewed your application. You can track its status from <strong>My Names<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n        <div class=\"success-btns\"><button class=\"btn-primary\" onclick=\"go('screen-table')\">Go to My Names<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ==================== MODALS ==================== -->\n<!-- Abandon flow warning modal -->\n<div class=\"modal-overlay\" id=\"modal-abandon\">\n  <div class=\"modal\">\n    <button class=\"modal-x-close\" onclick=\"closeModal('modal-abandon')\" aria-label=\"Close\">✕<\u002Fbutton>\n    <div class=\"modal-icon\" style=\"background:#fffbeb;color:#d97706\"><svg viewBox=\"0 0 24 24\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n    <h3>Leave this page?<\u002Fh3>\n    <p class=\"modal-sub\">Your progress won't be saved<\u002Fp>\n    <p style=\"font-size:13px;color:#374151;line-height:1.5;margin-bottom:16px\">Any details you've entered so far will be lost if you leave now. You'll need to start again when you come back.<\u002Fp>\n    <div class=\"modal-actions\">\n      <button class=\"btn-back\" onclick=\"closeModal('modal-abandon')\">Stay on this page<\u002Fbutton>\n      <button class=\"btn-primary\" style=\"background:#374151\" id=\"abandon-confirm-btn\">Leave<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Auto-renew ON modal -->\n<div class=\"modal-overlay\" id=\"modal-toggle-on\">\n  <div class=\"modal\">\n    <button onclick=\"closeModal('modal-toggle-on')\" style=\"position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:#9ca3af;font-size:18px;line-height:1;padding:0\">✕<\u002Fbutton>\n    <div class=\"modal-icon\" style=\"background:#f0fdf4;color:#16a34a\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n    <h3>Enable auto-renew?<\u002Fh3>\n    <p class=\"modal-sub\">Your reservation will automatically renew each year so you never lose the name.<\u002Fp>\n    <div class=\"modal-detail\">\n      <strong>What happens<\u002Fstrong>\n      On the expiry date, the reservation fee will be automatically charged to your payment method on file. You'll receive a reminder email 30 days before this date.<br><br>\n      You can turn this off at any time from My Names before the renewal date.\n    <\u002Fdiv>\n    <div class=\"modal-actions\">\n      <button class=\"btn-back\" onclick=\"cancelToggle('on')\">Cancel<\u002Fbutton>\n      <button class=\"btn-primary\" style=\"background:#16a34a\" onclick=\"confirmToggle('on')\">Enable auto-renew<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Auto-renew OFF modal -->\n<div class=\"modal-overlay\" id=\"modal-toggle-off\">\n  <div class=\"modal\">\n    <button onclick=\"closeModal('modal-toggle-off')\" style=\"position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:#9ca3af;font-size:18px;line-height:1;padding:0\">✕<\u002Fbutton>\n    <div class=\"modal-icon\" style=\"background:#fffbeb;color:#d97706\"><svg viewBox=\"0 0 24 24\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n    <h3>Turn off auto-renew?<\u002Fh3>\n    <p class=\"modal-sub\">Your reservation will not be renewed automatically when it expires.<\u002Fp>\n    <div class=\"modal-detail\">\n      <strong>What happens<\u002Fstrong>\n      This reservation will expire on its expiry date. After that, the name will be released and become available for others to reserve or register.<br><br>\n      You can re-enable auto-renew at any time from My Names before the expiry date.\n    <\u002Fdiv>\n    <div class=\"modal-actions\">\n      <button class=\"btn-back\" onclick=\"cancelToggle('off')\">Keep auto-renew on<\u002Fbutton>\n      <button class=\"btn-primary\" style=\"background:#d97706\" onclick=\"confirmToggle('off')\">Turn off auto-renew<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Cancel reservation modal -->\n<div class=\"modal-overlay\" id=\"modal-cancel\">\n  <div class=\"modal\">\n    <button class=\"modal-x-close\" onclick=\"closeModal('modal-cancel')\" aria-label=\"Close\">✕<\u002Fbutton>\n    <h3>Cancel reservation?<\u002Fh3>\n    <p class=\"modal-sub\">This action cannot be undone<\u002Fp>\n    <div class=\"modal-warn\"><svg viewBox=\"0 0 24 24\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg><p>Cancelling this reservation will release the name \"Larry Long Legs\" immediately. The name will become available for others to reserve or register. Any fees already paid for this reservation period are non-refundable.<\u002Fp><\u002Fdiv>\n    <div class=\"modal-actions\"><button class=\"btn-back\" onclick=\"closeModal('modal-cancel')\">Keep reservation<\u002Fbutton><button class=\"btn-primary\" onclick=\"closeModal('modal-cancel')\">Cancel reservation<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Register from table modal -->\n<div class=\"modal-overlay\" id=\"modal-register\">\n  <div class=\"modal\">\n    <button class=\"modal-x-close\" onclick=\"closeModal('modal-register')\" aria-label=\"Close\">✕<\u002Fbutton>\n    <h3>Register Larry Long Legs<\u002Fh3>\n    <p class=\"modal-sub\">Enter your horse's passport details to complete registration<\u002Fp>\n    <div class=\"modal-info\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg>\n      <div>\n        <p style=\"margin-bottom:6px\">Your name and meaning will carry over from the reservation. All vetting checks will be re-run on submission.<\u002Fp>\n        <div style=\"background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:8px 12px;font-size:12px;display:flex;gap:20px;flex-wrap:wrap\">\n          <div><span style=\"color:#6b7280\">Name: <\u002Fspan><strong style=\"color:#1a1a2e\">Larry Long Legs<\u002Fstrong><\u002Fdiv>\n          <div><span style=\"color:#6b7280\">Meaning: <\u002Fspan><span style=\"color:#374151\">my larry has long legs<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:#6b7280\">Pronunciation: <\u002Fspan><span style=\"color:#374151\">LAR-ee LONG LEGS<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-field\"><label>Enter your horse's passport number<\u002Flabel>\n      <div class=\"input-row\"><input type=\"text\" id=\"modal-passport\" placeholder=\"8260gb3405920v\"><button class=\"find-btn\" onclick=\"modalFindHorse()\">Find Horse<\u002Fbutton><\u002Fdiv>\n      <div id=\"modal-horse-result\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:11px;color:#9ca3af;margin-top:8px\">Once a horse is found, you'll continue through the registration flow.<\u002Fp>\n    <div class=\"modal-actions\" style=\"margin-top:16px\"><button class=\"btn-back\" onclick=\"closeModal('modal-register')\">Cancel<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nfunction toggleDeferredRow(e) {\n  if (e.target.closest('.dropdown')) return;\n  var expand = document.getElementById('deferred-expand');\n  var chevron = document.getElementById('deferred-chevron');\n  var isOpen = expand.style.display !== 'none';\n  expand.style.display = isOpen ? 'none' : 'table-row';\n  if (chevron) chevron.style.transform = isOpen ? '' : 'rotate(180deg)';\n}\n\n// ==================== TABLE FILTER ====================\nfunction filterTable(status) {\n  var rows = document.querySelectorAll('.data-table tbody tr:not(#deferred-expand)');\n  var visible = 0;\n  rows.forEach(function(row) {\n    var show = status === 'all' || row.getAttribute('data-status') === status;\n    row.style.display = show ? '' : 'none';\n    if (show) visible++;\n  });\n  var expand = document.getElementById('deferred-expand');\n  if (expand) expand.style.display = 'none';\n  document.getElementById('table-count').textContent = 'Showing ' + visible + ' application' + (visible !== 1 ? 's' : '');\n  document.querySelectorAll('.filter-pill').forEach(function(pill) {\n    pill.classList.remove('active');\n  });\n  event.currentTarget.classList.add('active');\n  closePanel();\n}\n\n// ==================== ROUTING ====================\n// Map screen ids to which top-level nav item should be highlighted.\nvar SCREEN_TO_NAV = {\n  'screen-table': 'm-ownership', 'screen-avail': 'm-ownership',\n  'screen-res-name': 'm-ownership', 'screen-res-option': 'm-ownership',\n  'screen-res1': 'm-ownership', 'screen-res2': 'm-ownership', 'screen-res3': 'm-ownership',\n  'screen-res-success': 'm-ownership',\n  'screen-reg1': 'm-ownership', 'screen-reg2': 'm-ownership', 'screen-reg3': 'm-ownership',\n  'screen-reg4': 'm-ownership', 'screen-reg-success': 'm-ownership',\n  'screen-con1': 'm-ownership', 'screen-con2': 'm-ownership', 'screen-con3': 'm-ownership',\n  'screen-con-success': 'm-ownership',\n  'screen-permission': 'm-ownership',\n  'screen-employees': 'm-trainer', 'screen-emp-profile': 'm-trainer',\n  'screen-add-emp-1': 'm-trainer', 'screen-add-emp-2': 'm-trainer',\n  'screen-add-emp-3': 'm-trainer', 'screen-add-emp-4': 'm-trainer',\n  'screen-add-emp-match': 'm-trainer',\n  'screen-update-emp': 'm-trainer',\n  'screen-terminate-1': 'm-trainer', 'screen-terminate-2': 'm-trainer',\n  'screen-apply-pass': 'm-trainer',\n  'screen-replace-pass-1': 'm-trainer',\n  'screen-update-photo': 'm-trainer'\n};\nfunction syncTopNavForScreen(id) {\n  var menu = SCREEN_TO_NAV[id];\n  document.querySelectorAll('.nav-item').forEach(function(it) { it.classList.remove('active'); });\n  if (menu) {\n    var item = document.querySelector('.nav-item[data-menu=\"' + menu + '\"]');\n    if (item) item.classList.add('active');\n  }\n}\ndocument.addEventListener('DOMContentLoaded', function() {\n  var active = document.querySelector('.screen.active');\n  if (active) syncTopNavForScreen(active.id);\n});\nfunction go(id) {\n  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));\n  document.getElementById(id).classList.add('active');\n  syncTopNavForScreen(id);\n  window.scrollTo(0,0);\n  closeMenus();\n}\n\n// ==================== TABLE ====================\nvar panelData = {\n  'larry': { name:'Larry Long Legs', owner:'J.Smith (Sole)',\n    html:`<div class=\"panel-section\"><div class=\"panel-section-title\">Name details<\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Proposed name<\u002Fspan><span class=\"val\">Larry Long Legs<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Meaning<\u002Fspan><span class=\"val\">my larry has long legs<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Pronunciation<\u002Fspan><span class=\"val\">LAR-ee LONG LEGS<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel-section\"><div class=\"panel-section-title\">Reservation details<\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reserved for<\u002Fspan><span class=\"val\">J.Smith (Sole)<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reserved date<\u002Fspan><span class=\"val\">10/05/2025<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Expiry date<\u002Fspan><span class=\"val\">11/05/2026<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reference<\u002Fspan><span class=\"val\">REF-2025-004<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Horse linked<\u002Fspan><span class=\"val\">None<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel-section\"><div class=\"panel-section-title\">Payment<\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Method<\u002Fspan><span class=\"val\">Direct Debit<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Account<\u002Fspan><span class=\"val\">****4521<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reservation fee<\u002Fspan><span class=\"val\">£60.00<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel-actions\">\n      <button class=\"panel-btn-primary\" onclick=\"openRegisterModal()\">Register this name<\u002Fbutton>\n      <button class=\"panel-btn-danger\" onclick=\"openCancelModal()\">Cancel reservation<\u002Fbutton>\n    <\u002Fdiv>`\n  },\n  'great-horse': { name:'Great Horse', owner:'J.Smith',\n    html:`<div class=\"panel-section\"><div class=\"panel-section-title\">Registration details<\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Horse<\u002Fspan><span class=\"val\">2025 ch Ounlek (IRE)<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Registered to<\u002Fspan><span class=\"val\">J.Smith (Sole Owner)<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Date registered<\u002Fspan><span class=\"val\">10/05/2021<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reference<\u002Fspan><span class=\"val\">REF-2020-001<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`\n  },\n  'midnight': { name:'Midnight Star', owner:'M.Jone',\n    html:`<div class=\"panel-section\"><div class=\"panel-section-title\">Application details<\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Status<\u002Fspan><span class=\"val\"><span class=\"badge badge-red-warning\" style=\"font-size:10px\">Permission required<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Horse<\u002Fspan><span class=\"val\">2024 b Frankel (GB)<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Submitted<\u002Fspan><span class=\"val\">10/05/2021<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reference<\u002Fspan><span class=\"val\">REF-2020-001<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel-section\">\n      <div style=\"background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:10px 12px\">\n        <div style=\"font-size:11px;font-weight:600;color:#92400e;margin-bottom:3px\">Permission required — 11 days remaining<\u002Fdiv>\n        <div style=\"font-size:11px;color:#374151;line-height:1.5\">Written permission from the rights holder needed by 19/05/2025 or the application will be rejected.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel-actions\">\n      <button class=\"panel-btn-primary\">How to provide permission<\u002Fbutton>\n    <\u002Fdiv>`\n  },\n  'swift': { name:'Swift Justice', owner:'M.Jone',\n    html:`<div class=\"panel-section\"><div class=\"panel-section-title\">Registration details<\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Horse<\u002Fspan><span class=\"val\">2024 gr Dubawi (IRE)<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Registered to<\u002Fspan><span class=\"val\">John Smith (Sole Owner)<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Date registered<\u002Fspan><span class=\"val\">10/05/2021<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reference<\u002Fspan><span class=\"val\">REF-2020-001<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel-actions\">\n      <button class=\"panel-btn-secondary\" onclick=\"go('screen-con1')\">Change of name<\u002Fbutton>\n    <\u002Fdiv>`\n  },\n  'royal': { name:'Royal Thunder', owner:'Smith Racing Ltd',\n    html:`<div class=\"panel-section\"><div class=\"panel-section-title\">Reservation details<\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reserved for<\u002Fspan><span class=\"val\">Smith Racing Ltd<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Expiry date<\u002Fspan><span class=\"val\">11/10/2021<\u002Fspan><\u002Fdiv>\n      <div class=\"panel-row\"><span class=\"lbl\">Reference<\u002Fspan><span class=\"val\">REF-2020-001<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel-actions\">\n      <button class=\"panel-btn-primary\" onclick=\"openRegisterModal()\">Register this name<\u002Fbutton>\n      <button class=\"panel-btn-danger\" onclick=\"openCancelModal()\">Cancel reservation<\u002Fbutton>\n    <\u002Fdiv>`\n  }\n};\n\nfunction openPanel(id) {\n  var d = panelData[id];\n  if (!d) return;\n  document.getElementById('panel-name').textContent = d.name;\n  document.getElementById('panel-owner').textContent = d.owner;\n  document.getElementById('panel-content').innerHTML = d.html;\n  document.getElementById('side-panel').classList.add('open');\n}\nfunction closePanel() { document.getElementById('side-panel').classList.remove('open'); }\n\nfunction toggleMenu(id) {\n  closeMenus();\n  var m = document.getElementById(id);\n  if (m) m.classList.toggle('open');\n}\nfunction closeMenus() { document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open')); }\n// ==================== DATE PICKER ====================\nvar pickerState = {\n  submitted: { open: false, year: 2026, month: 2, selected: null },\n  expiry:    { open: false, year: 2026, month: 2, selected: null }\n};\nvar MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nvar DAYS = ['Mo','Tu','We','Th','Fr','Sa','Su'];\n\nfunction togglePicker(id) {\n  var other = id === 'submitted' ? 'expiry' : 'submitted';\n  pickerState[other].open = false;\n  document.getElementById('picker-' + other).classList.remove('open');\n  pickerState[id].open = !pickerState[id].open;\n  if (pickerState[id].open) renderPicker(id);\n  document.getElementById('picker-' + id).classList.toggle('open', pickerState[id].open);\n}\n\nfunction renderPicker(id) {\n  var s = pickerState[id];\n  var today = new Date(2026, 2, 25);\n  var firstDay = new Date(s.year, s.month, 1).getDay();\n  var daysInMonth = new Date(s.year, s.month + 1, 0).getDate();\n  var startOffset = (firstDay === 0 ? 6 : firstDay - 1);\n\n  var dayHeaders = DAYS.map(function(d){ return '<span>' + d + '<\u002Fspan>'; }).join('');\n  var cells = '';\n  for (var i = 0; i < startOffset; i++) cells += '<button class=\"dp-day empty\"><\u002Fbutton>';\n  for (var d = 1; d <= daysInMonth; d++) {\n    var isToday = (s.year === today.getFullYear() && s.month === today.getMonth() && d === today.getDate());\n    var isSel = s.selected && s.selected.y === s.year && s.selected.m === s.month && s.selected.d === d;\n    var cls = 'dp-day' + (isToday ? ' today' : '') + (isSel ? ' selected' : '');\n    cells += '<button class=\"' + cls + '\" onclick=\"selectDay(\\'' + id + '\\',' + d + ')\">' + d + '<\u002Fbutton>';\n  }\n\n  document.getElementById('picker-' + id).innerHTML =\n    '<div class=\"dp-header\">' +\n      '<button class=\"dp-nav\" onclick=\"changeMonth(\\'' + id + '\\',-1)\">&#8249;<\u002Fbutton>' +\n      '<span class=\"dp-header-label\">' + MONTHS[s.month] + ' ' + s.year + '<\u002Fspan>' +\n      '<button class=\"dp-nav\" onclick=\"changeMonth(\\'' + id + '\\',1)\">&#8250;<\u002Fbutton>' +\n    '<\u002Fdiv>' +\n    '<div class=\"dp-grid\">' +\n      '<div class=\"dp-days-header\">' + dayHeaders + '<\u002Fdiv>' +\n      '<div class=\"dp-days\">' + cells + '<\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<div class=\"dp-footer\">' +\n      '<button class=\"dp-clear\" onclick=\"clearDate(\\'' + id + '\\')\">Clear<\u002Fbutton>' +\n      '<button class=\"dp-apply\" onclick=\"applyDate(\\'' + id + '\\')\">Apply<\u002Fbutton>' +\n    '<\u002Fdiv>';\n}\n\nfunction changeMonth(id, dir) {\n  var s = pickerState[id];\n  s.month += dir;\n  if (s.month > 11) { s.month = 0; s.year++; }\n  if (s.month < 0)  { s.month = 11; s.year--; }\n  renderPicker(id);\n  event.stopPropagation();\n}\n\nfunction selectDay(id, d) {\n  var s = pickerState[id];\n  s.selected = { y: s.year, m: s.month, d: d };\n  renderPicker(id);\n  event.stopPropagation();\n}\n\nfunction applyDate(id) {\n  var s = pickerState[id];\n  if (s.selected) {\n    var label = s.selected.d + '/' + String(s.selected.m + 1).padStart(2,'0') + '/' + s.selected.y;\n    document.getElementById(id + '-btn').textContent = label;\n  }\n  s.open = false;\n  document.getElementById('picker-' + id).classList.remove('open');\n  event.stopPropagation();\n}\n\nfunction clearDate(id) {\n  pickerState[id].selected = null;\n  document.getElementById(id + '-btn').textContent = 'Select date ▾';\n  pickerState[id].open = false;\n  document.getElementById('picker-' + id).classList.remove('open');\n  event.stopPropagation();\n}\n\ndocument.addEventListener('click', function(e) {\n  if (!e.target.closest('.filter-date') && !e.target.closest('.date-picker-popup')) {\n    ['submitted','expiry'].forEach(function(id) {\n      pickerState[id].open = false;\n      var el = document.getElementById('picker-' + id);\n      if (el) el.classList.remove('open');\n    });\n  }\n  if (!e.target.closest('.dropdown')) closeMenus();\n});\n\n\n// ==================== AVAILABILITY ====================\nvar takenNames = {\n  'frankel': {\n    reason: 'already registered',\n    detail: 'This name is already registered to an active horse in GB/IRE.',\n    horse: 'Frankel (GB)',\n    foaled: '2008',\n    trainer: 'Sir Henry Cecil',\n    note: 'Frankel is a protected name and will never be available for registration.'\n  },\n  'swift justice': { reason: 'already registered', detail: 'This name is already registered to an active horse in GB/IRE.', horse: '2024 gr Dubawi (IRE)' },\n  'great horse':   { reason: 'already registered', detail: 'This name is already registered to an active horse in GB/IRE.', horse: '2025 ch Ounlek (IRE)' },\n  'midnight star': { reason: 'already registered', detail: 'This name is already registered to an active horse in GB/IRE.', horse: '2024 b Frankel (GB)' },\n  'royal thunder': { reason: 'already registered', detail: 'This name is already registered to an active horse in GB/IRE.', horse: '2025 ch Ounlek (IRE)' }\n};\n\nvar famousNames = {\n  'nina simone': {\n    person: 'Nina Simone',\n    reason: 'This name references a famous person. Written permission from the rights holder or estate is required before this name can be approved.'\n  }\n};\n\nvar availChecked = false;\nvar famousPermFile = null;\n\nfunction availInput(v) {\n  document.getElementById('avail-result').innerHTML = '';\n  availChecked = false;\n  famousPermFile = null;\n}\n\nfunction checkAvail() {\n  var val = document.getElementById('avail-input').value.trim();\n  if (!val) return;\n  var key = val.toLowerCase();\n  var reqs = document.getElementById('avail-reqs');\n  reqs.style.display = 'none';\n\n  if (takenNames[key]) {\n    var t = takenNames[key];\n    var horseDetail = t.foaled\n      ? `<div style=\"margin-top:10px;background:white;border:1px solid #fecaca;border-radius:6px;padding:10px 12px\">\n          <div style=\"font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px\">Registered horse<\u002Fdiv>\n          <div style=\"display:flex;gap:20px;flex-wrap:wrap;font-size:12px\">\n            <div><span style=\"color:#6b7280\">Name: <\u002Fspan><strong style=\"color:#1a1a2e\">${t.horse}<\u002Fstrong><\u002Fdiv>\n            <div><span style=\"color:#6b7280\">Foaled: <\u002Fspan><span style=\"color:#374151\">${t.foaled}<\u002Fspan><\u002Fdiv>\n            <div><span style=\"color:#6b7280\">Trainer: <\u002Fspan><span style=\"color:#374151\">${t.trainer}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          ${t.note ? `<div style=\"margin-top:8px;padding-top:8px;border-top:1px solid #fecaca;font-size:12px;color:#92400e\">${t.note}<\u002Fdiv>` : ''}\n        <\u002Fdiv>`\n      : `<div style=\"margin-top:8px;font-size:12px;color:#374151\">Currently registered to: <strong>${t.horse}<\u002Fstrong><\u002Fdiv>`;\n\n    document.getElementById('avail-result').innerHTML =\n      `<div style=\"background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px 16px;margin-bottom:16px\">\n        <div style=\"display:flex;align-items:flex-start;gap:8px;margin-bottom:6px\">\n          <svg viewBox=\"0 0 24 24\" style=\"width:15px;height:15px;stroke:#dc2626;fill:none;stroke-width:2;flex-shrink:0;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"15\" y1=\"9\" x2=\"9\" y2=\"15\"/><line x1=\"9\" y1=\"9\" x2=\"15\" y2=\"15\"/><\u002Fsvg>\n          <div>\n            <div style=\"font-size:13px;font-weight:600;color:#dc2626;margin-bottom:2px\">\"${val}\" is not available<\u002Fdiv>\n            <div style=\"font-size:12px;color:#374151\">${t.detail}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        ${horseDetail}\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <button class=\"btn-primary\" onclick=\"document.getElementById('avail-input').value='';document.getElementById('avail-result').innerHTML='';document.getElementById('avail-reqs').style.display='block'\">Try a different name<\u002Fbutton>\n      <\u002Fdiv>`;\n\n  } else if (famousNames[key]) {\n    var f = famousNames[key];\n    document.getElementById('avail-result').innerHTML =\n      `<div style=\"background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:14px 16px;margin-bottom:14px\">\n        <div style=\"display:flex;align-items:flex-start;gap:8px;margin-bottom:10px\">\n          <svg viewBox=\"0 0 24 24\" style=\"width:15px;height:15px;stroke:#d97706;fill:none;stroke-width:2;flex-shrink:0;margin-top:1px\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/><\u002Fsvg>\n          <div>\n            <div style=\"font-size:13px;font-weight:600;color:#92400e;margin-bottom:2px\">Permission required — \"${val}\"<\u002Fdiv>\n            <div style=\"font-size:12px;color:#374151;line-height:1.5\">${f.reason}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid #fde68a;padding-top:12px;margin-top:2px\">\n          <div style=\"font-size:12px;font-weight:600;color:#374151;margin-bottom:8px\">Upload permission document <span style=\"font-weight:400;color:#9ca3af\">(optional — you can also submit this after approval)<\u002Fspan><\u002Fdiv>\n\n          <div id=\"famous-upload-zone\" onclick=\"triggerFamousUpload()\" style=\"border:2px dashed #fde68a;border-radius:6px;padding:18px;text-align:center;cursor:pointer;background:white;transition:all 0.15s\">\n            <svg viewBox=\"0 0 24 24\" style=\"width:22px;height:22px;stroke:#d97706;fill:none;stroke-width:1.5;margin:0 auto 6px;display:block\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4\"/><polyline points=\"17 8 12 3 7 8\"/><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/><\u002Fsvg>\n            <div style=\"font-size:12px;font-weight:500;color:#374151;margin-bottom:2px\">Drop file here or <span style=\"color:#BE1337\">browse<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11px;color:#9ca3af\">PDF, JPG or PNG — max 10MB<\u002Fdiv>\n            <input type=\"file\" id=\"famous-file-input\" accept=\".pdf,.jpg,.jpeg,.png\" style=\"display:none\" onchange=\"famousFileSelected(this)\">\n          <\u002Fdiv>\n\n          <div id=\"famous-file-preview\" style=\"display:none;margin-top:8px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px;align-items:center;gap:8px\">\n            <svg viewBox=\"0 0 24 24\" style=\"width:16px;height:16px;stroke:#16a34a;fill:none;stroke-width:2;flex-shrink:0\"><path d=\"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><\u002Fsvg>\n            <div style=\"flex:1\"><div style=\"font-size:12px;font-weight:500;color:#1a1a2e\" id=\"famous-file-name\"><\u002Fdiv><div style=\"font-size:11px;color:#9ca3af\" id=\"famous-file-size\"><\u002Fdiv><\u002Fdiv>\n            <button onclick=\"removeFamousFile()\" style=\"background:none;border:none;cursor:pointer;color:#9ca3af;font-size:14px;padding:0 2px\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid #fde68a;padding-top:12px;margin-top:12px\">\n          <label style=\"display:flex;align-items:flex-start;gap:8px;cursor:pointer\">\n            <input type=\"checkbox\" id=\"famous-ack\" style=\"margin-top:2px;accent-color:#d97706;flex-shrink:0\" onchange=\"checkFamousReady()\">\n            <span style=\"font-size:12px;color:#374151;line-height:1.4\">I understand this name references a famous person and I am responsible for obtaining and submitting written permission from the rights holder or estate.<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:8px;align-items:center\">\n        <button class=\"btn-primary\" id=\"btn-famous-continue\" disabled onclick=\"go('screen-res-name')\" style=\"opacity:0.4;cursor:not-allowed\">Continue with this name<\u002Fbutton>\n        <button class=\"btn-back\" onclick=\"document.getElementById('avail-input').value='';document.getElementById('avail-result').innerHTML='';document.getElementById('avail-reqs').style.display='block'\">Try a different name<\u002Fbutton>\n      <\u002Fdiv>`;\n\n  } else {\n    document.getElementById('avail-result').innerHTML =\n      `<div class=\"status-msg status-ok\" style=\"display:flex;margin-bottom:16px\">\n        <svg viewBox=\"0 0 24 24\" style=\"width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>\n        Good news — \"${val}\" is available\n      <\u002Fdiv>\n      <div class=\"actions\" style=\"justify-content:flex-start;margin-top:0\">\n        <button class=\"btn-back\" style=\"margin-right:8px\" onclick=\"go('screen-avail')\">Try another name<\u002Fbutton>\n        <button class=\"btn-primary\" onclick=\"go('screen-res-name')\">Continue<\u002Fbutton>\n      <\u002Fdiv>`;\n  }\n}\n\nfunction triggerFamousUpload() { document.getElementById('famous-file-input').click(); }\nfunction famousFileSelected(input) {\n  if (!input.files || !input.files[0]) return;\n  var file = input.files[0];\n  famousPermFile = file;\n  var size = file.size < 1024*1024 ? Math.round(file.size/1024)+' KB' : (file.size/(1024*1024)).toFixed(1)+' MB';\n  document.getElementById('famous-file-name').textContent = file.name;\n  document.getElementById('famous-file-size').textContent = size;\n  document.getElementById('famous-file-preview').style.display = 'flex';\n  document.getElementById('famous-upload-zone').style.borderColor = '#16a34a';\n  document.getElementById('famous-upload-zone').style.background = '#f0fdf4';\n}\nfunction removeFamousFile() {\n  famousPermFile = null;\n  document.getElementById('famous-file-input').value = '';\n  document.getElementById('famous-file-preview').style.display = 'none';\n  document.getElementById('famous-upload-zone').style.borderColor = '#fde68a';\n  document.getElementById('famous-upload-zone').style.background = 'white';\n}\nfunction checkFamousReady() {\n  var ack = document.getElementById('famous-ack');\n  var btn = document.getElementById('btn-famous-continue');\n  if (!ack || !btn) return;\n  btn.disabled = !ack.checked;\n  btn.style.opacity = ack.checked ? '1' : '0.4';\n  btn.style.cursor = ack.checked ? 'pointer' : 'not-allowed';\n}\n// ==================== RESERVE NAME DETAILS ====================\nfunction checkResName() {\n  var m = document.getElementById('res-meaning').value.trim();\n  var p = document.getElementById('res-pron').value.trim();\n  document.getElementById('btn-res-name').disabled = !(m && p);\n}\n\n// ==================== CHOOSE OPTION ====================\nvar selectedOption = 'reserve';\nfunction selectOption(v) {\n  selectedOption = v;\n  document.getElementById('opt-reserve').classList.toggle('selected', v === 'reserve');\n  document.getElementById('opt-register').classList.toggle('selected', v === 'register');\n  document.querySelector('#opt-reserve input').checked = v === 'reserve';\n  document.querySelector('#opt-register input').checked = v === 'register';\n}\nfunction continueOption() {\n  go(selectedOption === 'register' ? 'screen-reg1' : 'screen-res1');\n}\n\n// ==================== RESERVE ====================\nfunction selRes1(v) {\n  document.getElementById('rr-own-p').className = 'sub-panel' + (v==='own' ? ' open' : '');\n  document.getElementById('rr-other-p').className = 'sub-panel' + (v==='other' ? ' open' : '');\n}\nvar autorenewOn = true;\nfunction toggleAutorenew() {\n  autorenewOn = !autorenewOn;\n  var t = document.getElementById('autorenew-toggle');\n  t.className = 'toggle-btn' + (autorenewOn ? '' : ' off');\n}\nfunction selPay(flow, type) {\n  var prefix = flow + '-pay-';\n  ['acct','dd','card'].forEach(function(t) {\n    var el = document.getElementById(prefix + t);\n    if (el) el.className = 'sub-panel' + (t === type ? ' open' : '');\n  });\n}\n\n// ==================== REGISTER ====================\nvar horseFound = false;\nfunction regPassportInput(v) {\n  document.getElementById('horse-result').innerHTML = '';\n  horseFound = false;\n  document.getElementById('btn-reg1').disabled = true;\n}\nfunction findHorse() {\n  var val = document.getElementById('reg-passport').value.trim().toLowerCase();\n  var invalid = ['invalid','badpassport'];\n  var exported = ['exported','gb123export'];\n  var named = ['named','alreadynamed'];\n  var result = '';\n  if (!val) return;\n  var contactHtml = `<div style=\"margin-top:10px;padding-top:10px;border-top:1px solid #fecaca;display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280\"><svg viewBox=\"0 0 24 24\" style=\"width:13px;height:13px;stroke:#9ca3af;fill:none;stroke-width:2;flex-shrink:0\"><path d=\"M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.06 1.18 2 2 0 012.03 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z\"/><\u002Fsvg><span><strong style=\"color:#374151\">Weatherbys:<\u002Fstrong> +44 (0)207 152 0260 &nbsp;·&nbsp; Mon–Fri 9.00am–5.00pm<\u002Fspan><\u002Fdiv>`;\n  if (invalid.some(function(v){return val.includes(v);})) {\n    result = `<div class=\"horse-card\" style=\"background:#fef2f2;border-color:#fecaca\"><div class=\"horse-card-header\"><svg viewBox=\"0 0 24 24\" style=\"stroke:#dc2626\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/><\u002Fsvg><span style=\"color:#dc2626\">Horse not eligible: invalid passport<\u002Fspan><\u002Fdiv><p style=\"font-size:12px;color:#374151;line-height:1.5\">There is an issue with this horse's passport record. The name registration cannot proceed until the passport issue is resolved. Please contact Weatherbys to resolve this before registering a name.<\u002Fp>${contactHtml}<\u002Fdiv>`;\n  } else if (exported.some(function(v){return val.includes(v);})) {\n    result = `<div class=\"horse-card\" style=\"background:#fef2f2;border-color:#fecaca\"><div class=\"horse-card-header\"><svg viewBox=\"0 0 24 24\" style=\"stroke:#dc2626\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/><\u002Fsvg><span style=\"color:#dc2626\">Horse not eligible: exported abroad<\u002Fspan><\u002Fdiv><p style=\"font-size:12px;color:#374151;line-height:1.5\">This horse has been exported and is no longer registered in GB/IRE. Please contact the racing authority in the country the horse was exported to. If you believe this is an error, contact Weatherbys for assistance.<\u002Fp>${contactHtml}<\u002Fdiv>`;\n  } else if (named.some(function(v){return val.includes(v);})) {\n    result = `<div class=\"horse-card\" style=\"background:#fef2f2;border-color:#fecaca\"><div class=\"horse-card-header\"><svg viewBox=\"0 0 24 24\" style=\"stroke:#dc2626\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/><\u002Fsvg><span style=\"color:#dc2626\">This horse is already named<\u002Fspan><\u002Fdiv><p style=\"font-size:12px;color:#374151;line-height:1.5\">This horse is currently registered as \"Midnight Runner\". You cannot register a new name for a horse that already has one.<br><br>If you'd like to rename this horse, you can apply through the Change of Name process instead.<\u002Fp><button class=\"inelig-btn\" onclick=\"go('screen-con1')\">Change horse name →<\u002Fbutton>${contactHtml}<\u002Fdiv>`;\n  } else {\n    horseFound = true;\n    result = `<div class=\"horse-card\"><div class=\"horse-card-header\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Horse found<\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Passport number<\u002Fspan><span class=\"val\">8260GB45901990T<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Current name<\u002Fspan><span class=\"val\">Unnamed<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Foaling date<\u002Fspan><span class=\"val\">15 March 2022<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Colour<\u002Fspan><span class=\"val\">Bay<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Sex<\u002Fspan><span class=\"val\">Colt<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Sire<\u002Fspan><span class=\"val\">Dubawi (IRE)<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Dam<\u002Fspan><span class=\"val\">Starlight (GB)<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Dam's sire<\u002Fspan><span class=\"val\">Galileo (IRE)<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-hint\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/><\u002Fsvg>Click the card to view full horse details<\u002Fdiv>\n    <\u002Fdiv>`;\n    document.getElementById('btn-reg1').disabled = false;\n  }\n  document.getElementById('horse-result').innerHTML = result;\n}\n\nfunction selReg2(v) {\n  document.getElementById('reg2-own-p').className = 'sub-panel' + (v==='own' ? ' open' : '');\n  document.getElementById('reg2-other-p').className = 'sub-panel' + (v==='other' ? ' open' : '');\n}\nfunction selRegAddr(v) {\n  document.getElementById('reg-addr-form').className = 'addr-form' + (v==='diff' ? ' open' : '');\n}\n\n// ==================== CHANGE OF NAME ====================\n// Horses the user owns. Eligibility = no race starts AND has a registered name.\nvar conHorses = [\n  { id:'swift',     name:'Swift Justice',         breeding:'2024 gr Dubawi (IRE)',         owner:'John Smith (Sole Owner)',  ref:'REF-2020-001', starts:0, eligible:true,  reason:'No race starts' },\n  { id:'northern',  name:'Northern Crown',        breeding:'2025 b Kingman (GB)',          owner:'Smith Racing Ltd',         ref:'REF-2024-118', starts:0, eligible:true,  reason:'No race starts' },\n  { id:'yard-fav',  name:'Yard Favourite',        breeding:'2024 b Galileo (IRE)',         owner:'John Smith (Sole Owner)',  ref:'REF-2023-072', starts:0, eligible:true,  reason:'No race starts' },\n  { id:'great',     name:'Great Horse',           breeding:'2025 ch Ounlek (IRE)',         owner:'John Smith (Sole Owner)',  ref:'REF-2020-001', starts:4, eligible:false, reason:'Has raced — 4 starts' },\n  { id:'midnight',  name:'Midnight Star',         breeding:'2024 b Frankel (GB)',          owner:'John Smith (Sole Owner)',  ref:'REF-2020-001', starts:2, eligible:false, reason:'Has raced — 2 starts' },\n  { id:'quiet-det', name:'Quiet Determination',   breeding:'2023 b Sea The Stars (IRE)',   owner:'John Smith (Sole Owner)',  ref:'REF-2022-419', starts:7, eligible:false, reason:'Has raced — 7 starts' }\n];\nvar conPickedHorseId = null;\n\nfunction renderConHorseList() {\n  var okHost  = document.getElementById('horse-pick-list-ok');\n  var badHost = document.getElementById('horse-pick-list-bad');\n  if (!okHost || !badHost) return;\n  okHost.innerHTML = '';\n  badHost.innerHTML = '';\n  conHorses.forEach(function(h) {\n    var row = document.createElement('label');\n    row.className = 'horse-pick-row' + (h.eligible ? '' : ' disabled') + (conPickedHorseId === h.id ? ' selected' : '');\n    row.setAttribute('data-horse-id', h.id);\n    var statusClass = h.eligible ? 'ok' : 'bad';\n    var statusIcon = h.eligible\n      ? '<svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>'\n      : '<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/><\u002Fsvg>';\n    row.innerHTML =\n      '<input type=\"radio\" name=\"con-horse-pick\" value=\"' + h.id + '\"' + (h.eligible ? '' : ' disabled') + (conPickedHorseId === h.id ? ' checked' : '') + '>' +\n      '<div class=\"horse-pick-info\">' +\n        '<div class=\"horse-pick-name\">' + h.name + '<\u002Fdiv>' +\n        '<div class=\"horse-pick-meta\">' + h.breeding + '<span class=\"sep\">·<\u002Fspan>' + h.owner + '<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n      '<div class=\"horse-pick-status ' + statusClass + '\">' + statusIcon + h.reason + '<\u002Fdiv>';\n    if (h.eligible) {\n      row.addEventListener('click', function(e) { pickConHorse(h.id); });\n      okHost.appendChild(row);\n    } else {\n      row.addEventListener('click', function(e) { e.preventDefault(); });\n      badHost.appendChild(row);\n    }\n  });\n  // Hide empty section labels\n  document.querySelectorAll('.horse-pick-section-label').forEach(function(lbl, i) {\n    var list = lbl.nextElementSibling;\n    lbl.style.display = (list && list.children.length) ? '' : 'none';\n  });\n}\n\nfunction pickConHorse(id) {\n  conPickedHorseId = id;\n  document.getElementById('btn-con-pick').disabled = false;\n  document.querySelectorAll('#screen-con-pick .horse-pick-row').forEach(function(r) {\n    r.classList.toggle('selected', r.getAttribute('data-horse-id') === id);\n    var inp = r.querySelector('input[type=radio]');\n    if (inp) inp.checked = (r.getAttribute('data-horse-id') === id);\n  });\n}\n\nfunction applyConHorse(id) {\n  var h = conHorses.find(function(x) { return x.id === id; });\n  if (!h) return;\n  document.querySelectorAll('.con-val-current').forEach(function(el) { el.textContent = h.name; });\n  document.querySelectorAll('.con-val-horse').forEach(function(el) { el.textContent = h.breeding; });\n  document.querySelectorAll('.con-val-owner').forEach(function(el) { el.textContent = h.owner; });\n  document.querySelectorAll('.con-val-ref').forEach(function(el) { el.textContent = h.ref; });\n  // Reset name fields\n  var nameInput = document.getElementById('con-name');\n  if (nameInput) { nameInput.value = ''; }\n  var meaning = document.getElementById('con-meaning');\n  if (meaning) meaning.value = '';\n  var pron = document.getElementById('con-pron');\n  if (pron) pron.value = '';\n  var char = document.getElementById('con-char');\n  if (char) char.textContent = '0 / 18 characters';\n  var ok = document.getElementById('con-avail');     if (ok) ok.style.display = 'none';\n  var bad = document.getElementById('con-unavail');  if (bad) bad.style.display = 'none';\n  var ctx1 = document.getElementById('con-ctx-name'); if (ctx1) ctx1.textContent = '—';\n  var ctx2 = document.getElementById('con-ctx-name2'); if (ctx2) ctx2.textContent = '—';\n  var succ = document.getElementById('con-success-name'); if (succ) succ.textContent = '—';\n  conNameOk = false;\n  var nextBtn = document.getElementById('btn-con1'); if (nextBtn) nextBtn.disabled = true;\n}\n\nfunction confirmConPick() {\n  if (!conPickedHorseId) return;\n  applyConHorse(conPickedHorseId);\n  go('screen-con1');\n}\n\n// \"Can't find your horse?\" — passport lookup.\n// Fake lookup DB keyed by passport number. Includes one eligible result + one\n// ineligible (already raced) so both outcomes are demonstrable.\nvar conLookupDB = {\n  'GBR40123456': { id:'lookup-iron',   name:'Iron Resolve',  breeding:'2024 b Lope De Vega (IRE)', owner:'Alan King (Sole Owner)', ref:'PASS-GBR40123456', starts:0, eligible:true,  reason:'No race starts' },\n  'IRE12345678': { id:'lookup-quiet',  name:'Distant Echo',  breeding:'2022 ch Camelot (GB)',      owner:'Alan King (Sole Owner)', ref:'PASS-IRE12345678', starts:3, eligible:false, reason:'Has raced — 3 starts' }\n};\n\nfunction toggleHorseLookup() {\n  var box = document.querySelector('.horse-lookup');\n  var body = document.getElementById('horse-lookup-body');\n  if (!box || !body) return;\n  var open = box.classList.toggle('open');\n  body.hidden = !open;\n  if (!open) {\n    document.getElementById('horse-lookup-result').hidden = true;\n  }\n}\n\nfunction lookupHorse() {\n  var passport = (document.getElementById('lookup-passport').value || '').trim().toUpperCase();\n  var resultEl = document.getElementById('horse-lookup-result');\n  resultEl.hidden = false;\n  if (!passport) {\n    resultEl.className = 'horse-lookup-result notfound';\n    resultEl.textContent =
