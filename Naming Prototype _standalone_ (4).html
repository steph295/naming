 'Enter a passport number to search.';\n    return;\n  }\n  var match = conLookupDB[passport];\n  if (!match) {\n    resultEl.className = 'horse-lookup-result notfound';\n    resultEl.innerHTML = '<strong>No horse found<\u002Fstrong> for passport <strong>' + passport + '<\u002Fstrong>. Double-check the passport, or contact Weatherbys if the horse should be linked to your account.';\n    return;\n  }\n  // Avoid duplicates if user re-searches the same horse\n  if (!conHorses.some(function(h) { return h.id === match.id; })) {\n    conHorses.push(match);\n  }\n  renderConHorseList();\n  resultEl.className = 'horse-lookup-result found';\n  resultEl.innerHTML = '<strong>' + match.name + '<\u002Fstrong> (' + match.breeding + ') has been added to the list above.' +\n    (match.eligible ? ' Select it to continue.' : ' Note: this horse isn\\u2019t eligible (' + match.reason + ').');\n  // Scroll the matching row into view & flash-select if eligible\n  setTimeout(function() {\n    var row = document.querySelector('#screen-con-pick .horse-pick-row[data-horse-id=\"' + match.id + '\"]');\n    if (row) {\n      row.style.transition = 'background 0.4s';\n      row.style.background = '#fefbe8';\n      setTimeout(function() { row.style.background = ''; }, 1000);\n      if (match.eligible) pickConHorse(match.id);\n    }\n  }, 50);\n}\n\n// Entry from a names-table row dropdown — preselect that horse and skip the picker.\nfunction openConFromTable(horseId) {\n  conPickedHorseId = horseId;\n  applyConHorse(horseId);\n  go('screen-con1');\n}\n\ndocument.addEventListener('DOMContentLoaded', renderConHorseList);\n\n// ==================== CHARGE-TO-EXISTING-ACCOUNT PANEL ====================\n// Only accounts where the current user has explicit charge authority appear here.\n// (Trainers can act for owners that have authorised them; for other owners, they\n// must use Direct Debit or Card to avoid one trainer charging another's account.)\nvar OWNERSHIP_ACCOUNTS = [\n  { id:'sole-js',    label:'Sole ownership \\u2014 John Smith',                    type:'sole',  owner:'John Smith' },\n  { id:'joint-shrs', label:'Joint ownership (by shares) \\u2014 Smith Racing Ltd', type:'joint', owner:'Smith Racing Ltd', shareNote:'Single invoicing account on file' },\n  { id:'split-bp',   label:'Bluebell Partnership (split charges)',                type:'split', partners:[\n      { name:'John Smith',     role:'Managing Partner', share:40 },\n      { name:'Sarah Collins',  role:'Partner',          share:30 },\n      { name:'Hugh O\\u2019Brien', role:'Partner',       share:20 },\n      { name:'Maria Jones',    role:'Partner',          share:10 }\n    ] },\n  { id:'split-nm',   label:'Northern Mares Syndicate (split charges)',            type:'split', partners:[\n      { name:'Alan King',      role:'Lead Partner',     share:50 },\n      { name:'Eleanor Brown',  role:'Partner',          share:25 },\n      { name:'Tom Whittaker',  role:'Partner',          share:25 }\n    ] }\n];\n\nfunction payAcctFee(flow) {\n  if (flow === 'res') return 60;\n  if (flow === 'reg' || flow === 'con') return 60;\n  return 60;\n}\n\nfunction renderPayAcctDetail(host, accountId, flow) {\n  var acct = OWNERSHIP_ACCOUNTS.find(function(a) { return a.id === accountId; });\n  if (!acct) { host.innerHTML = ''; return; }\n  var fee = payAcctFee(flow);\n  if (acct.type === 'split') {\n    var rows = acct.partners.map(function(p) {\n      var amt = (fee * p.share / 100).toFixed(2);\n      return '<li>' +\n        '<span><span class=\"p-name\">' + p.name + '<\u002Fspan><span class=\"p-meta\">' + p.role + '<\u002Fspan><\u002Fspan>' +\n        '<span class=\"p-share\">' + p.share + '% \\u00b7 \\u00a3' + amt + '<\u002Fspan>' +\n      '<\u002Fli>';\n    }).join('');\n    host.className = 'pay-acct-detail split';\n    host.innerHTML =\n      '<div class=\"pay-acct-split-head\">' +\n        '<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/><\u002Fsvg>' +\n        '<div><strong>Charges will be split among the partners.<\u002Fstrong> Each partner is invoiced their share separately according to the partnership agreement on file.<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n      '<ul class=\"pay-acct-partners\">' + rows + '<\u002Ful>' +\n      '<div class=\"pay-acct-split-foot\"><span>Total to invoice<\u002Fspan><span>\\u00a3' + fee.toFixed(2) + '<\u002Fspan><\u002Fdiv>';\n  } else {\n    host.className = 'pay-acct-detail single';\n    var parts = acct.label.split(' \\u2014 ');\n    var acctName = parts.length > 1 ? parts[1] : acct.label;\n    var sub = acct.shareNote ? ' \\u2014 ' + acct.shareNote : '';\n    host.innerHTML =\n      '<svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>' +\n      '<div>Single invoicing account: <strong>' + acctName + '<\u002Fstrong>. \\u00a3' + fee.toFixed(2) + ' will be charged to this account on submission.' + sub + '<\u002Fdiv>';\n  }\n}\n\nfunction renderPayAcctPanels() {\n  document.querySelectorAll('.pay-acct-panel').forEach(function(panel) {\n    if (panel.dataset.rendered) return;\n    var flow = panel.getAttribute('data-pay-acct') || 'reg';\n    var opts = OWNERSHIP_ACCOUNTS.map(function(a) {\n      return '<option value=\"' + a.id + '\">' + a.label + '<\u002Foption>';\n    }).join('');\n    panel.innerHTML =\n      '<div class=\"pay-acct-help\">' +\n        '<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0110 0v4\"/><\u002Fsvg>' +\n        'Showing only ownerships where you are the named owner or have charge-account authority. To bill an account you don\\u2019t see here, choose Direct Debit or Pay by card instead.' +\n      '<\u002Fdiv>' +\n      '<select class=\"pay-acct-select\" onclick=\"event.stopPropagation()\" onchange=\"renderPayAcctDetail(this.nextElementSibling, this.value, \\'' + flow + '\\')\">' + opts + '<\u002Fselect>' +\n      '<div class=\"pay-acct-detail\"><\u002Fdiv>';\n    var sel = panel.querySelector('select');\n    renderPayAcctDetail(panel.querySelector('.pay-acct-detail'), sel.value, flow);\n    panel.dataset.rendered = '1';\n  });\n}\ndocument.addEventListener('DOMContentLoaded', renderPayAcctPanels);\n\nvar conNameOk = false;\nfunction conNameInput(val) {\n  var el = document.getElementById('con-char');\n  el.textContent = val.length + ' / 18 characters';\n  el.className = 'char-count' + (val.length >= 16 ? ' warn' : '');\n  document.getElementById('con-avail').style.display = 'none';\n  document.getElementById('con-unavail').style.display = 'none';\n  conNameOk = false;\n  conCheck();\n}\nfunction conCheckAvail() {\n  var val = document.getElementById('con-name').value.trim();\n  if (!val) return;\n  var taken = ['swift justice','great horse','midnight star','royal thunder'];\n  var ok = taken.indexOf(val.toLowerCase()) === -1;\n  document.getElementById('con-avail').className = 'status-msg' + (ok ? ' status-ok' : '');\n  document.getElementById('con-unavail').className = 'status-msg' + (!ok ? ' status-err' : '');\n  document.getElementById('con-avail').style.display = ok ? 'flex' : 'none';\n  document.getElementById('con-unavail').style.display = !ok ? 'flex' : 'none';\n  if (!ok) document.getElementById('con-unavail-msg').textContent = 'This name is already registered to another horse.';\n  conNameOk = ok;\n  if (ok) {\n    document.getElementById('con-ctx-name').textContent = val;\n    document.getElementById('con-ctx-name2').textContent = val;\n    document.getElementById('con-success-name').textContent = val;\n  }\n  conCheck();\n}\nfunction conCheck() {\n  var m = document.getElementById('con-meaning').value.trim();\n  var p = document.getElementById('con-pron').value.trim();\n  document.getElementById('btn-con1').disabled = !(conNameOk && m && p);\n}\nfunction selConAddr(v) {\n  document.getElementById('con-addr-form').className = 'addr-form' + (v==='diff' ? ' open' : '');\n}\n\n// ==================== MODALS ====================\nvar abandonTarget = null;\nfunction openAbandon(target) {\n  abandonTarget = target;\n  document.getElementById('modal-abandon').classList.add('open');\n  document.getElementById('abandon-confirm-btn').onclick = function() {\n    closeModal('modal-abandon');\n    go(abandonTarget);\n    abandonTarget = null;\n  };\n}\n\nfunction openCancelModal() { document.getElementById('modal-cancel').classList.add('open'); }\nfunction openRegisterModal() { document.getElementById('modal-register').classList.add('open'); }\nfunction closeModal(id) { document.getElementById(id).classList.remove('open'); }\n\n// Close modal when clicking the dark backdrop (not the modal content)\ndocument.querySelectorAll('.modal-overlay').forEach(function(ov) {\n  ov.addEventListener('click', function(e) {\n    if (e.target === ov) ov.classList.remove('open');\n  });\n});\n\n// Close any open modal/panel on Escape\ndocument.addEventListener('keydown', function(e) {\n  if (e.key !== 'Escape') return;\n  document.querySelectorAll('.modal-overlay.open').forEach(function(ov) { ov.classList.remove('open'); });\n  var pp = document.getElementById('pass-panel');\n  var po = document.getElementById('pass-overlay');\n  if (pp && pp.classList.contains('open')) { pp.classList.remove('open'); po.classList.remove('open'); }\n});\n\nvar pendingToggle = null;\nfunction openToggleModal(name, currentState) {\n  pendingToggle = name;\n  var modalId = currentState === 'on' ? 'modal-toggle-off' : 'modal-toggle-on';\n  document.getElementById(modalId).classList.add('open');\n}\nfunction cancelToggle(type) {\n  document.getElementById('modal-toggle-' + type).classList.remove('open');\n  pendingToggle = null;\n}\nfunction confirmToggle(type) {\n  document.getElementById('modal-toggle-' + type).classList.remove('open');\n  if (!pendingToggle) return;\n  var track = document.getElementById('toggle-' + pendingToggle);\n  if (!track) return;\n  if (type === 'on') {\n    track.className = 'toggle-track on';\n  } else {\n    track.className = 'toggle-track';\n  }\n  pendingToggle = null;\n}\n\nfunction modalFindHorse() {\n  var val = document.getElementById('modal-passport').value.trim();\n  if (!val) return;\n  document.getElementById('modal-horse-result').innerHTML = `\n    <div class=\"horse-card\" style=\"margin-top:10px\">\n      <div class=\"horse-card-header\"><svg viewBox=\"0 0 24 24\" style=\"width:14px;height:14px;stroke:#16a34a;fill:none;stroke-width:2\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Horse found<\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Passport<\u002Fspan><span class=\"val\">8260GB45901990T<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Current name<\u002Fspan><span class=\"val\">Unnamed<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Foaling date<\u002Fspan><span class=\"val\">15 March 2022<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Colour<\u002Fspan><span class=\"val\">Bay<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Sex<\u002Fspan><span class=\"val\">Colt<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Sire<\u002Fspan><span class=\"val\">Dubawi (IRE)<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Dam<\u002Fspan><span class=\"val\">Starlight (GB)<\u002Fspan><\u002Fdiv>\n      <div class=\"horse-card-row\"><span class=\"lbl\">Dam's sire<\u002Fspan><span class=\"val\">Galileo (IRE)<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;text-align:right\">\n      <button class=\"btn-primary\" onclick=\"closeModal('modal-register');goRegFromRes()\">Continue to registration →<\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\nfunction goRegFromRes() {\n  var banner = document.getElementById('reg1-reservation-banner');\n  if (banner) banner.style.display = 'block';\n  document.getElementById('reg1-back-btn').onclick = function(){ go('screen-table'); };\n  document.getElementById('btn-reg1').disabled = false;\n  go('screen-reg2');\n}\n\n// ==================== PERMISSION UPLOAD ====================\nfunction triggerUpload() {\n  document.getElementById('file-input').click();\n}\nfunction fileSelected(input) {\n  if (!input.files || !input.files[0]) return;\n  var file = input.files[0];\n  var size = file.size < 1024*1024\n    ? Math.round(file.size/1024) + ' KB'\n    : (file.size/(1024*1024)).toFixed(1) + ' MB';\n  document.getElementById('file-name').textContent = file.name;\n  document.getElementById('file-size').textContent = size;\n  document.getElementById('file-preview').style.display = 'flex';\n  document.getElementById('upload-zone').style.borderColor = '#16a34a';\n  document.getElementById('upload-zone').style.background = '#f0fdf4';\n}\nfunction removeFile() {\n  document.getElementById('file-input').value = '';\n  document.getElementById('file-preview').style.display = 'none';\n  document.getElementById('upload-zone').style.borderColor = '#d1d5db';\n  document.getElementById('upload-zone').style.background = '#fafafa';\n}\nfunction submitPermission() {\n  document.getElementById('modal-perm-success').classList.add('open');\n}\n<\u002Fscript>\n<!-- ==================== PERMISSION UPLOAD SCREEN ==================== -->\n<div class=\"screen\" id=\"screen-permission\">\n  <div class=\"flow-bar\">\n    <button class=\"back-btn\" onclick=\"go('screen-table')\">\n      <svg viewBox=\"0 0 24 24\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>\n      Back to My Names\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:center;padding:36px 20px;background:#f0f2f5;min-height:calc(100vh - 88px)\">\n    <div style=\"max-width:600px;width:100%\">\n\n      <div style=\"margin-bottom:20px\">\n        <h2 style=\"font-size:17px;font-weight:600;color:#1a1a2e;margin-bottom:4px\">Provide permission<\u002Fh2>\n        <p style=\"font-size:12px;color:#6b7280;line-height:1.5\">Upload written permission from the rights holder or estate. This is required for names that reference a famous person.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Application context -->\n      <div style=\"background:white;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;gap:28px;font-size:12px\">\n        <div><div style=\"color:#9ca3af;margin-bottom:2px;font-size:11px\">Application<\u002Fdiv><div style=\"font-weight:600;color:#1a1a2e\">Midnight Star<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"color:#9ca3af;margin-bottom:2px;font-size:11px\">Reference<\u002Fdiv><div style=\"font-weight:600;color:#1a1a2e\">REF-2020-001<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"color:#9ca3af;margin-bottom:2px;font-size:11px\">Deadline<\u002Fdiv><div style=\"font-weight:600;color:#dc2626\">19/05/2025 — 11 days remaining<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- What's needed -->\n      <div style=\"background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px 20px;margin-bottom:14px\">\n        <h3 style=\"font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:12px\">What you need to provide<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start\">\n            <div style=\"width:20px;height:20px;background:#f0fdf4;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px\">\n              <svg viewBox=\"0 0 24 24\" style=\"width:11px;height:11px;stroke:#16a34a;fill:none;stroke-width:2.5\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:13px;font-weight:500;color:#1a1a2e\">Written permission from the rights holder or estate<\u002Fdiv>\n              <div style=\"font-size:12px;color:#6b7280;margin-top:2px\">A signed letter or official document confirming they consent to the horse name<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\">\n            <div style=\"width:20px;height:20px;background:#f0fdf4;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px\">\n              <svg viewBox=\"0 0 24 24\" style=\"width:11px;height:11px;stroke:#16a34a;fill:none;stroke-width:2.5\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:13px;font-weight:500;color:#1a1a2e\">The document must reference the proposed name and horse<\u002Fdiv>\n              <div style=\"font-size:12px;color:#6b7280;margin-top:2px\">Correspondence should clearly state the name \"Midnight Star\" and be addressed to Weatherbys<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-start\">\n            <div style=\"width:20px;height:20px;background:#fffbeb;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px\">\n              <svg viewBox=\"0 0 24 24\" style=\"width:11px;height:11px;stroke:#d97706;fill:none;stroke-width:2\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:13px;font-weight:500;color:#1a1a2e\">Accepted formats: PDF, JPG, PNG<\u002Fdiv>\n              <div style=\"font-size:12px;color:#6b7280;margin-top:2px\">Maximum file size 10MB. Scanned documents are acceptable.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- vg>Back<\u002Fbutton>\n        <button class=\"pool-btn-next\" id=\"pool3-submit\" disabled=\"\" onclick=\"poolSubmit()\">Submit Return <svg viewBox=\"0 0 24 24\"><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"5\"><\u002Fline><polyline points=\"5 12 12 5 19 12\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============= POOL STEP 4: RECEIPT ============= -->\n<div class=\"screen\" id=\"screen-pool-4\">\n  <div style=\"background:#2b2f3e;height:40px;display:flex;align-items:center;padding:0 40px\">\n    <a onclick=\"poolBackToDashboard()\" style=\"color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer\">← Back to employees<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"pool-flow-body\">\n    <aside class=\"pool-aside\">\n      <div class=\"pool-stepper-label\">Stable Pool Money Return<\u002Fdiv>\n      <div class=\"pool-side-step\"><div class=\"pool-side-col\"><div class=\"pool-side-dot done\">✓<\u002Fdiv><div class=\"pool-side-line done\"><\u002Fdiv><\u002Fdiv><div class=\"pool-side-text done\">Select employees<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-side-step\"><div class=\"pool-side-col\"><div class=\"pool-side-dot done\">✓<\u002Fdiv><div class=\"pool-side-line done\"><\u002Fdiv><\u002Fdiv><div class=\"pool-side-text done\">Add amounts<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-side-step\"><div class=\"pool-side-col\"><div class=\"pool-side-dot done\">✓<\u002Fdiv><\u002Fdiv><div class=\"pool-side-text done\">Review<\u002Fdiv><\u002Fdiv>\n    <\u002Faside>\n  <div class=\"pool-flow-wrap\">\n    <h2 class=\"pool-section-h\" style=\"font-size:20px;margin-top:0\">Return submitted<\u002Fh2>\n    <p class=\"pool-page-instr\">Your Stable Pool Money Return has been submitted to the BHA. <strong>Print a copy and display it at the stable for at least 10 days<\u002Fstrong> so all employees can inspect it (rule 13.3).<\u002Fp>\n\n    <div class=\"pool-alert success\">\n      <div class=\"pool-alert-icon\"><svg viewBox=\"0 0 24 24\" style=\"width:11px;height:11px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n      <div><h4>Stable Pool Money Return Complete<\u002Fh4><p>You have successfully completed your Stable Pool Money Return for this quarter.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"pool-alert warn\">\n      <div class=\"pool-alert-icon\"><svg viewBox=\"0 0 24 24\" style=\"width:11px;height:11px\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n      <div><h4>Print Stable Employee Return<\u002Fh4><p>Under rule 13.3 you will need to display a copy of the Stable Employee Return as so amended at the stable in a place where it can be inspected by all employees for at least 10 days from the date of the Stable Employee Return is returned to the BHA. You will need to display this to the yard. <a class=\"pool-doc-link\"><strong>Print copy of Return<\u002Fstrong><\u002Fa><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"pool-info-bar\" style=\"flex-wrap:wrap;gap:0;row-gap:12px\">\n      <div class=\"pool-info-cell\"><div class=\"pool-info-val\">£51,084.28<\u002Fdiv><div class=\"pool-info-lbl\">Total amount distributed<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-info-cell\"><div class=\"pool-info-val\" style=\"font-size:14px\">01/02/2025 - 30/04/2025<\u002Fdiv><div class=\"pool-info-lbl\">Return Period<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-info-cell\"><div class=\"pool-info-val\" style=\"font-size:14px\">31/05/2025<\u002Fdiv><div class=\"pool-info-lbl\">Return By Date<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-info-cell\"><div class=\"pool-info-val\" style=\"font-size:14px\">06/05/2026<\u002Fdiv><div class=\"pool-info-lbl\">Submitted Date<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-info-cell\"><div class=\"pool-info-val\" style=\"font-size:14px\">06/05/2026<\u002Fdiv><div class=\"pool-info-lbl\">Signature Date<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-info-cell\"><div class=\"pool-info-val\" style=\"font-size:14px\" id=\"pool4-paydate\">17/05/2026<\u002Fdiv><div class=\"pool-info-lbl\">Payment to Staff<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-info-cell flex-grow\" style=\"display:flex;gap:24px;justify-content:flex-end;align-items:center\">\n        <a class=\"pool-info-link\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><line x1=\"7\" y1=\"9\" x2=\"17\" y2=\"9\"><\u002Fline><line x1=\"7\" y1=\"13\" x2=\"17\" y2=\"13\"><\u002Fline><\u002Fsvg>View statement of<br>transactions<\u002Fa>\n        <a class=\"pool-info-link\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg>Distribution Criteria<br>Document<\u002Fa>\n        <a class=\"pool-print-link\"><svg viewBox=\"0 0 24 24\"><polyline points=\"6 9 6 2 18 2 18 9\"><\u002Fpolyline><path d=\"M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2\"><\u002Fpath><rect x=\"6\" y=\"14\" width=\"12\" height=\"8\"><\u002Frect><\u002Fsvg>Print Distribution<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <table class=\"pool-emp-table\" style=\"margin-top:18px\">\n      <thead>\n        <tr>\n          <th style=\"width:90px\">SER<\u002Fth>\n          <th>Employee<\u002Fth>\n          <th>Type<\u002Fth>\n          <th>Job Title<\u002Fth>\n          <th>Start Date<\u002Fth>\n          <th>End Date<\u002Fth>\n          <th style=\"text-align:right;width:100px\">% Split<\u002Fth>\n          <th style=\"text-align:right;width:120px\">Amount £<\u002Fth>\n        <\u002Ftr>\n      <\u002Fthead>\n      <tbody id=\"pool4-tbody\"><\u002Ftbody>\n    <\u002Ftable>\n\n    <div class=\"pool-totals\" style=\"font-size:15px;margin-top:14px\"><span class=\"lbl\">Total distributed: <\u002Fspan><strong id=\"pool4-total-val\">£21,984.51<\u002Fstrong><\u002Fdiv>\n\n    <div class=\"pool-receipt-meta\">\n      <div class=\"pool-receipt-meta-cell\"><div class=\"lbl\">Distribution Criteria Document<\u002Fdiv><div class=\"val\"><a class=\"pool-doc-link\">distribution_criteria.pdf<\u002Fa><\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-receipt-meta-cell\"><div class=\"lbl\">Name of person completing form<\u002Fdiv><div class=\"val\" id=\"pool4-name\">Audrey Wilson<\u002Fdiv><\u002Fdiv>\n      <div style=\"width:100%;height:0\"><\u002Fdiv>\n      <div class=\"pool-receipt-meta-cell\"><div class=\"lbl\">Date of signature<\u002Fdiv><div class=\"val\">06/05/2026<\u002Fdiv><\u002Fdiv>\n      <div class=\"pool-receipt-meta-cell\"><div class=\"lbl\">Date of payment<\u002Fdiv><div class=\"val\" id=\"pool4-paydate2\">17/05/2026<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n// ==================== POOL MONEY RETURN JS ====================\nvar POOL_TOTAL = 21984.51;\nvar POOL_EMPLOYEES = [\n  { ser:'123456', name:'Stephen Appleby', type:'Self Employed', job:'Travelling Head Lad / Lass', start:'06/02/2022', end:'-' },\n  { ser:'234567', name:'Molly Appleton', type:'Full Time', job:'Stable Lad / Lass', start:'12/04/2020', end:'-' },\n  { ser:'455678', name:'Laurence Baker', type:'Self Employed', job:'Work Rider', start:'16/05/2023', end:'-' },\n  { ser:'493845', name:'Violet Barton', type:'Part Time', job:'Trainers Secretary', start:'21/08/2011', end:'-' },\n  { ser:'302948', name:'John Burrows', type:'Full Time', job:'Pupil under Training', start:'16/02/2022', end:'19/09/2023' },\n  { ser:'120001', name:'Pat Daly', type:'Part Time', job:'Stable Lad / Lass', start:'21/08/2015', end:'-' },\n  { ser:'120002', name:'Liam Godfrey', type:'Full Time', job:'Gallop Man / Woman', start:'19/09/2019', end:'-' },\n  { ser:'120003', name:'George Hill', type:'Part Time', job:'Yard Man / Woman', start:'21/12/2010', end:'-' },\n  { ser:'120004', name:'Ciaran Mooney', type:'Self Employed', job:'Stable Lad / Lass', start:'03/07/2020', end:'-' }\n];\n// State\nvar poolSelected = {};   // ser -> bool\nvar poolAmounts = {};    // ser -> {pct, amount}\nvar poolMode = 'pound';  // pound | pct | equal\nvar poolCriteria = null; // 'no' | 'yes'\n\nfunction startPoolReturn() {\n  poolSelected = {};\n  poolAmounts = {};\n  poolMode = 'pound';\n  poolCriteria = null;\n  poolRenderEmployees();\n  poolUpdateNext1();\n  go('screen-pool-1');\n}\n\nfunction poolRenderEmployees() {\n  var tb = document.getElementById('pool1-tbody');\n  if (!tb) return;\n  tb.innerHTML = POOL_EMPLOYEES.map(function(e) {\n    var sel = !!poolSelected[e.ser];\n    return '<tr class=\"' + (sel?'selected':'') + '\">' +\n      '<td><div class=\"pool-cb ' + (sel?'checked':'') + '\" onclick=\"poolToggle(\\'' + e.ser + '\\')\"><\u002Fdiv><\u002Ftd>' +\n      '<td>' + e.ser + '<\u002Ftd>' +\n      '<td><strong>' + e.name + '<\u002Fstrong><\u002Ftd>' +\n      '<td>' + e.type + '<\u002Ftd>' +\n      '<td>' + e.job + '<\u002Ftd>' +\n      '<td>' + e.start + '<\u002Ftd>' +\n      '<td>' + e.end + '<\u002Ftd>' +\n    '<\u002Ftr>';\n  }).join('');\n}\n\nfunction poolToggle(ser) {\n  poolSelected[ser] = !poolSelected[ser];\n  poolRenderEmployees();\n  poolUpdateNext1();\n  poolUpdateAllCb();\n}\n\nfunction poolToggleAll() {\n  var allSelected = POOL_EMPLOYEES.every(function(e){ return poolSelected[e.ser]; });\n  POOL_EMPLOYEES.forEach(function(e) { poolSelected[e.ser] = !allSelected; });\n  poolRenderEmployees();\n  poolUpdateNext1();\n  poolUpdateAllCb();\n}\n\nfunction poolUpdateAllCb() {\n  var cb = document.getElementById('pool1-cb-all');\n  if (!cb) return;\n  var allSelected = POOL_EMPLOYEES.every(function(e){ return poolSelected[e.ser]; });\n  cb.classList.toggle('checked', allSelected);\n}\n\nfunction poolUpdateNext1() {\n  var any = Object.keys(poolSelected).some(function(k){ return poolSelected[k]; });\n  document.getElementById('pool1-next').disabled = !any;\n}\n\nfunction poolGoStep2() {\n  // Initialize amounts for selected employees\n  var selected = POOL_EMPLOYEES.filter(function(e){ return poolSelected[e.ser]; });\n  selected.forEach(function(e){\n    if (!poolAmounts[e.ser]) poolAmounts[e.ser] = { pct:0, amount:0 };\n  });\n  poolMode = 'pound';\n  poolRenderAmounts();\n  poolUpdateModeRadios();\n  poolUpdateTotals();\n  poolUpdateNext2();\n  go('screen-pool-2');\n}\n\nfunction poolRenderAmounts() {\n  var tb = document.getElementById('pool2-tbody');\n  if (!tb) return;\n  var selected = POOL_EMPLOYEES.filter(function(e){ return poolSelected[e.ser]; });\n  tb.innerHTML = selected.map(function(e) {\n    var amt = poolAmounts[e.ser] || { pct:0, amount:0 };\n    var pctDisplay = amt.pct > 0 ? amt.pct.toFixed(2) : '0.00';\n    var pctClass = amt.pct > 0 ? 'pool-pct-cell has-value' : 'pool-pct-cell';\n    var amtDisplay = amt.amount > 0 ? '£' + amt.amount.toFixed(2) : '';\n    if (poolMode === 'pct') {\n      return '<tr>' +\n        '<td>' + e.ser + '<\u002Ftd>' +\n        '<td><strong>' + e.name + '<\u002Fstrong><\u002Ftd>' +\n        '<td>' + e.type + '<\u002Ftd>' +\n        '<td>' + e.job + '<\u002Ftd>' +\n        '<td>' + e.start + '<\u002Ftd>' +\n        '<td>' + e.end + '<\u002Ftd>' +\n        '<td style=\"text-align:right\"><input type=\"text\" class=\"pool-amount-input percent\" value=\"' + (amt.pct>0?amt.pct.toFixed(2):'0.00') + '\" onchange=\"poolEditPct(\\'' + e.ser + '\\',this.value)\"> %<\u002Ftd>' +\n        '<td style=\"text-align:right\" class=\"pool-pct-cell ' + (amt.amount>0?'has-value':'') + '\">£' + amt.amount.toFixed(2) + '<\u002Ftd>' +\n      '<\u002Ftr>';\n    } else {\n      return '<tr>' +\n        '<td>' + e.ser + '<\u002Ftd>' +\n        '<td><strong>' + e.name + '<\u002Fstrong><\u002Ftd>' +\n        '<td>' + e.type + '<\u002Ftd>' +\n        '<td>' + e.job + '<\u002Ftd>' +\n        '<td>' + e.start + '<\u002Ftd>' +\n        '<td>' + e.end + '<\u002Ftd>' +\n        '<td style=\"text-align:right\" class=\"' + pctClass + '\">' + pctDisplay + '%<\u002Ftd>' +\n        '<td style=\"text-align:right\"><input type=\"text\" class=\"pool-amount-input\" ' + (poolMode==='equal'?'readonly':'') + ' value=\"' + (amt.amount>0?'£'+amt.amount.toFixed(2):'£ 0.00') + '\" onchange=\"poolEditAmt(\\'' + e.ser + '\\',this.value)\"><\u002Ftd>' +\n      '<\u002Ftr>';\n    }\n  }).join('');\n}\n\nfunction poolEditAmt(ser, raw) {\n  var v = parseFloat(String(raw).replace(/[^0-9.]/g,'')) || 0;\n  poolAmounts[ser].amount = v;\n  poolAmounts[ser].pct = (v / POOL_TOTAL) * 100;\n  poolRenderAmounts();\n  poolUpdateTotals();\n  poolUpdateNext2();\n}\nfunction poolEditPct(ser, raw) {\n  var v = parseFloat(String(raw).replace(/[^0-9.]/g,'')) || 0;\n  poolAmounts[ser].pct = v;\n  poolAmounts[ser].amount = (v/100) * POOL_TOTAL;\n  poolRenderAmounts();\n  poolUpdateTotals();\n  poolUpdateNext2();\n}\n\nfunction poolSetMode(mode) {\n  poolMode = mode;\n  if (mode === 'equal') {\n    var selected = POOL_EMPLOYEES.filter(function(e){ return poolSelected[e.ser]; });\n    var n = selected.length;\n    var per = POOL_TOTAL / n;\n    var perPct = 100 / n;\n    selected.forEach(function(e){\n      poolAmounts[e.ser] = { amount: per, pct: perPct };\n    });\n  }\n  poolUpdateModeRadios();\n  poolRenderAmounts();\n  poolUpdateTotals();\n  poolUpdateNext2();\n}\n\nfunction poolUpdateModeRadios() {\n  ['pound','pct','equal'].forEach(function(m){\n    var el = document.getElementById('pool2-mode-' + m);\n    if (el) el.classList.toggle('active', poolMode === m);\n  });\n}\n\nfunction poolUpdateTotals() {\n  var sum = 0;\n  Object.keys(poolAmounts).forEach(function(k){\n    if (poolSelected[k]) sum += poolAmounts[k].amount;\n  });\n  var pct = (sum / POOL_TOTAL) * 100;\n  var remain = POOL_TOTAL - sum;\n  var totalEl = document.getElementById('pool2-total-val');\n  var pctEl = document.getElementById('pool2-pct-val');\n  var remainEl = document.getElementById('pool2-remain-display');\n  if (totalEl) {\n    totalEl.textContent = '£' + sum.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});\n    totalEl.className = 'val ' + (sum===0?'zero':(Math.abs(sum-POOL_TOTAL)<0.01?'complete':'partial'));\n  }\n  if (pctEl) {\n    pctEl.textContent = (Math.round(pct*10)/10) + '%';\n    pctEl.className = 'val ' + (sum===0?'zero':(Math.abs(sum-POOL_TOTAL)<0.01?'complete':'partial'));\n  }\n  if (remainEl) {\n    remainEl.textContent = '£' + remain.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});\n    remainEl.style.color = Math.abs(remain)<0.01 ? '#5fd398' : '#ff5e7d';\n  }\n}\n\nfunction poolSetCriteria(v) {\n  poolCriteria = v;\n  document.getElementById('pool2-crit-no').classList.toggle('active', v==='no');\n  document.getElementById('pool2-crit-yes').classList.toggle('active', v==='yes');\n  // Add filled circle for selected\n  ['no','yes'].forEach(function(k){\n    var el = document.getElementById('pool2-crit-'+k);\n    el.style.borderColor = (poolCriteria===k) ? '#1a2037' : '#c0c5ce';\n    el.innerHTML = (poolCriteria===k) ? '<span style=\"width:9px;height:9px;border-radius:50%;background:#1a2037\"><\u002Fspan>' : '';\n    el.style.display = 'inline-flex';\n    el.style.alignItems = 'center';\n    el.style.justifyContent = 'center';\n  });\n  document.getElementById('pool2-upload').style.display = (v==='yes') ? '' : 'none';\n  poolUpdateNext2();\n}\n\nfunction poolUpdateNext2() {\n  var sum = 0;\n  Object.keys(poolAmounts).forEach(function(k){\n    if (poolSelected[k]) sum += poolAmounts[k].amount;\n  });\n  var fullDistributed = Math.abs(sum - POOL_TOTAL) < 0.01;\n  var hasCrit = poolCriteria !== null;\n  document.getElementById('pool2-next').disabled = !(fullDistributed && hasCrit);\n}\n\nfunction poolGoStep3() {\n  poolRenderReview('pool3-tbody', 'pool3-total-val');\n  poolValidate3();\n  go('screen-pool-3');\n}\n\nfunction poolRenderReview(tbodyId, totalId) {\n  var tb = document.getElementById(tbodyId);\n  if (!tb) return;\n  var selected = POOL_EMPLOYEES.filter(function(e){ return poolSelected[e.ser]; });\n  var sum = 0;\n  tb.innerHTML = selected.map(function(e) {\n    var amt = poolAmounts[e.ser] || { pct:0, amount:0 };\n    sum += amt.amount;\n    return '<tr>' +\n      '<td>' + e.ser + '<\u002Ftd>' +\n      '<td><strong>' + e.name + '<\u002Fstrong><\u002Ftd>' +\n      '<td>' + e.type + '<\u002Ftd>' +\n      '<td>' + e.job + '<\u002Ftd>' +\n      '<td>' + e.start + '<\u002Ftd>' +\n      '<td>' + e.end + '<\u002Ftd>' +\n      '<td style=\"text-align:right\">' + (Math.round(amt.pct*10)/10) + '%<\u002Ftd>' +\n      '<td style=\"text-align:right\">£' + amt.amount.toFixed(2) + '<\u002Ftd>' +\n    '<\u002Ftr>';\n  }).join('');\n  document.getElementById(totalId).textContent = '£' + sum.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});\n}\n\nfunction poolValidate3() {\n  var name = (document.getElementById('pool3-name').value || '').trim();\n  var date = (document.getElementById('pool3-paydate').value || '').trim();\n  document.getElementById('pool3-submit').disabled = !(name && date);\n}\n\nfunction poolSubmit() {\n  var name = document.getElementById('pool3-name').value || 'Audrey Wilson';\n  var date = document.getElementById('pool3-paydate').value || '17/05/2026';\n  document.getElementById('pool4-name').textContent = name;\n  document.getElementById('pool4-paydate').textContent = date;\n  document.getElementById('pool4-paydate2').textContent = date;\n  poolRenderReview('pool4-tbody', 'pool4-total-val');\n  go('screen-pool-4');\n}\n\nfunction poolBackToDashboard() {\n  // Mark return submitted in the table & show banner\n  empState.showPoolBanner = true;\n  go('screen-employees');\n  // Switch the inner tab to Pool Money\n  setTimeout(function(){\n    if (typeof empSwitchTab === 'function') empSwitchTab('pool');\n    var banner = document.getElementById('pool-success-banner');\n    if (banner) banner.innerHTML = '<div class=\"banner banner-success\" style=\"margin:14px 0\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Stable Pool Money Return submitted successfully<\u002Fdiv><button class=\"banner-close\" onclick=\"document.getElementById(\\'pool-success-banner\\').innerHTML=\\'\\'\">✕<\u002Fbutton><\u002Fdiv>';\n    // Update the latest row to show as Submitted\n    var firstRow = document.querySelector('#pool-tab-content tbody tr:first-child');\n    if (firstRow) {\n      firstRow.innerHTML = '<td>01/02/2025 - 30/04/2025<\u002Ftd><td>£21,984.51<\u002Ftd><td>31/05/2025<\u002Ftd><td>06/05/2026<\u002Ftd><td>06/05/2026<\u002Ftd><td><span class=\"badge-submitted\">Submitted<\u002Fspan><\u002Ftd><td><a class=\"pass-link\" onclick=\"go(\\'screen-pool-4\\')\">View<\u002Fa><\u002Ftd>';\n    }\n  }, 80);\n}\n<\u002Fscript>\n\n<script>\n// ==================== EMPLOYEE MANAGEMENT JS ====================\n\nvar empState = {\n  duplicatesResolved: false,\n  passActive: true,\n  showWelcomeBanner: false,\n  showTerminationBanner: false,\n  showPoolBanner: false,\n  showPassCancelBanner: false,\n  showUpdateBanner: false,\n  showPassApplyBanner: false,\n  showReplacementBanner: false,\n  showPhotoUpdatedBanner: false,\n  showPhotoRenewalWarning: true,\n  showReinstateBanner: false,\n  showDuplicatesMergedBanner: false\n};\n\nvar empData = {\n  '19203': { name:'Richard Adams', initials:'RA', color:'#e0e7ff', textColor:'#3730a3' },\n  '48273': { name:'Adam Browne', initials:'AB', color:'#dbeafe', textColor:'#1e40af' },\n  '23928': { name:'Katie Butler', initials:'KB', color:'#fef3c7', textColor:'#92400e' },\n  '19392': { name:'Daniel Carey', initials:'DC', color:'#dcfce7', textColor:'#15803d' },\n  '11939': { name:'Andrew Carroll', initials:'AC', color:'#ede9fe', textColor:'#6d28d9' },\n  '51842': { name:'Sarah Mitchell', initials:'SM', color:'#fce7f3', textColor:'#be185d' },\n  '49102': { name:'James Donovan', initials:'JD', color:'#fef3c7', textColor:'#92400e' },\n  '52301': { name:'Emily Hughes', initials:'EH', color:'#dcfce7', textColor:'#15803d', noPass:true },\n  '50194': { name:'Thomas Kelly', initials:'TK', color:'#ede9fe', textColor:'#6d28d9' }\n};\n\nfunction goEmployeeProfile(id) {\n  var d = empData[id];\n  if (!d) return;\n  document.getElementById('profile-card-name').textContent = d.name;\n  document.getElementById('profile-card-ser').textContent = id;\n  var photo = document.getElementById('profile-card-photo');\n  photo.textContent = d.initials;\n  photo.style.background = d.color;\n  photo.style.color = d.textColor;\n  // Reset body sections back to the trainer-side default (Adam Browne layout).\n  applyViewingProfile('Alan King');\n  // Restore the row-specific header values that applyViewingProfile just overwrote.\n  document.getElementById('profile-card-name').textContent = d.name;\n  document.getElementById('profile-card-ser').textContent = id;\n  photo.textContent = d.initials;\n  photo.style.background = d.color;\n  photo.style.color = d.textColor;\n  renderProfileBanners();\n  go('screen-emp-profile');\n}\n\nfunction renderProfileBanners() {\n  var html = '';\n  var name = document.getElementById('profile-card-name').textContent;\n  var ser = document.getElementById('profile-card-ser').textContent;\n  var d = empData[ser];\n\n  if (empState.showUpdateBanner) {\n    html += '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Employment details updated successfully<\u002Fdiv><button class=\"banner-close\" onclick=\"dismissBanner(\\'showUpdateBanner\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n  if (empState.showPassCancelBanner) {\n    html += '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Racehorse pass cancelled successfully<\u002Fdiv><button class=\"banner-close\" onclick=\"dismissBanner(\\'showPassCancelBanner\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n  if (empState.showPassApplyBanner) {\n    html += '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Pass card application sent to BHA — payment of £20.10 charged to your account<\u002Fdiv><button class=\"banner-close\" onclick=\"dismissBanner(\\'showPassApplyBanner\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n  if (empState.showReplacementBanner) {\n    html += '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Replacement pass requested — £10.50 charged. New card posted within 5 working days.<\u002Fdiv><button class=\"banner-close\" onclick=\"dismissBanner(\\'showReplacementBanner\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n  if (empState.showPhotoUpdatedBanner) {\n    html += '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>ID photo updated — new renewal date set to 06/05/2028<\u002Fdiv><button class=\"banner-close\" onclick=\"dismissBanner(\\'showPhotoUpdatedBanner\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n  // Photo renewal warning (shows on Adam's profile while not dismissed)\n  if (empState.showPhotoRenewalWarning && ser === '48273') {\n    html += '<div class=\"banner banner-warn\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><path d=\"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/><\u002Fsvg><div><strong>ID photo renewal due in 2 months<\u002Fstrong> — due 20/07/2025. Update the photo before this date to avoid the pass being suspended.<\u002Fdiv><\u002Fdiv><button class=\"banner-action\" onclick=\"go(\\'screen-update-photo\\')\">Update photo<\u002Fbutton><button class=\"banner-close\" onclick=\"dismissBanner(\\'showPhotoRenewalWarning\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n\n  // Pass status updates\n  if (!empState.passActive) {\n    document.getElementById('profile-pass-status').textContent = 'No';\n    document.getElementById('profile-view-pass-btn').style.display = 'none';\n    document.getElementById('profile-cancel-pass-btn').style.display = 'none';\n    document.getElementById('profile-replace-btn').style.display = 'none';\n    document.getElementById('profile-apply-pass-btn').style.display = '';\n  } else {\n    document.getElementById('profile-pass-status').textContent = 'Yes';\n    document.getElementById('profile-view-pass-btn').style.display = '';\n    document.getElementById('profile-cancel-pass-btn').style.display = 'none';\n    document.getElementById('profile-replace-btn').style.display = 'none';\n    document.getElementById('profile-apply-pass-btn').style.display = 'none';\n  }\n\n  document.getElementById('profile-banners').innerHTML = html;\n}\n\nfunction renderEmpListBanners() {\n  var html = '';\n  if (empState.showWelcomeBanner) {\n    html += '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Magic link sent to Emma Harris — she has 14 days to confirm her details and submit<\u002Fdiv><button class=\"banner-action\" onclick=\"empSubtab(\\'pending\\')\">Track in Pending invites<\u002Fbutton><button class=\"banner-close\" onclick=\"dismissBanner(\\'showWelcomeBanner\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n  if (empState.showTerminationBanner) {\n    html += '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Employment terminated — Adam Browne moved to past employees<\u002Fdiv><button class=\"banner-close\" onclick=\"dismissBanner(\\'showTerminationBanner\\')\">✕<\u002Fbutton><\u002Fdiv>';\n  }\n  document.getElementById('emp-banners').innerHTML = html;\n}\n\nfunction dismissBanner(key) {\n  empState[key] = false;\n  renderProfileBanners();\n  renderEmpListBanners();\n}\n\nfunction openCancelPassModal() {\n  document.getElementById('modal-cancel-pass').classList.add('open');\n}\n\nfunction confirmCancelPass() {\n  empState.passActive = false;\n  empState.showPassCancelBanner = true;\n  closeModal('modal-cancel-pass');\n  renderProfileBanners();\n}\n\nfunction checkDisclaimer() {\n  var val = document.getElementById('disclaimer-name').value.trim();\n  document.getElementById('btn-disclaimer').disabled = !val;\n}\n\nfunction submitAddEmployee() {\n  empState.showWelcomeBanner = true;\n  go('screen-employees');\n  renderEmpListBanners();\n}\n\n// ==================== REGISTRATION FLOW (NEW) ====================\nvar regState = { method: 'trainer', otherTrainers: false, otherTrainersList: [], roles: 1, handoverEmail: true, handoverSms: false, matchSelection: null };\n\nfunction selectMethod(which) {\n  regState.method = which;\n  document.getElementById('method-trainer').classList.toggle('selected', which === 'trainer');\n  document.getElementById('method-invite').classList.toggle('selected', which === 'invite');\n}\n\nfunction continueFromMethod() {\n  if (regState.method === 'invite') {\n    go('screen-add-emp-invite');\n  } else {\n    go('screen-add-emp-1');\n  }\n}\n\nfunction sendInvite() {\n  go('screen-add-emp-invite-success');\n}\n\nfunction toggleOtherTrainer(btn, value) {\n  regState.otherTrainers = value;\n  var siblings = btn.parentElement.querySelectorAll('button');\n  siblings.forEach(function(b){ b.classList.remove('active'); });\n  btn.classList.add('active');\n  var fields = document.getElementById('other-trainer-fields');\n  if (value === true || value === 'unsure') {\n    fields.style.display = 'block';\n    if (value === true && document.getElementById('other-trainer-list').children.length === 0) {\n      addOtherTrainer();\n    }\n  } else {\n    fields.style.display = 'none';\n  }\n}\n\nfunction addOtherTrainer() {\n  var list = document.getElementById('other-trainer-list');\n  var idx = list.children.length;\n  var row = document.createElement('div');\n  row.className = 'other-trainer-card';\n  row.style.display = 'block';\n  row.style.padding = '12px 14px';\n  row.innerHTML = '<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">' +\n    '<b style=\"font-size:11px;color:#1a2037;text-transform:uppercase;letter-spacing:0.4px\">Trainer ' + (idx + 1) + '<\u002Fb>' +\n    '<button type=\"button\" onclick=\"this.closest(\\'.other-trainer-card\\').remove()\" style=\"background:none;border:none;color:#b2113a;font-size:11px;cursor:pointer;font-family:inherit;font-weight:500\">Remove<\u002Fbutton>' +\n    '<\u002Fdiv>' +\n    '<div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:10px\">' +\n    '<div class=\"field\" style=\"margin:0\"><label style=\"font-size:11px;margin-bottom:4px;display:block;color:#6b7280\">Trainer name<\u002Flabel><input type=\"text\" placeholder=\"e.g. G. Patterson\" style=\"width:100%;padding:7px 10px;border:1px solid #d8dde2;border-radius:4px;font-family:inherit;font-size:12px\"><\u002Fdiv>' +\n    '<div class=\"field\" style=\"margin:0\"><label style=\"font-size:11px;margin-bottom:4px;display:block;color:#6b7280\">Role<\u002Flabel><input type=\"text\" placeholder=\"e.g. Work Rider\" style=\"width:100%;padding:7px 10px;border:1px solid #d8dde2;border-radius:4px;font-family:inherit;font-size:12px\"><\u002Fdiv>' +\n    '<\u002Fdiv>';\n  list.appendChild(row);\n}\n\nfunction goAfterDetails() {\n  // Apply tweaks state to match step\n  renderMatchState();\n  go('screen-add-emp-match');\n}\n\nfunction selectMatch(el, key) {\n  var cards = document.querySelectorAll('#match-found-state .match-card, #match-found-state .none-of-card');\n  cards.forEach(function(c){ c.classList.remove('selected'); });\n  el.classList.add('selected');\n  var warning = document.getElementById('match-warning');\n  if (warning) warning.style.display = (key === 'james' || key === 'james2') ? 'block' : 'none';\n  regState.matchSelection = key;\n}\n\n// People Match multi-select handlers\nfunction pmToggle(checkbox) {\n  var card = checkbox.closest('.pm-card');\n  if (card) card.classList.toggle('selected', checkbox.checked);\n  var checks = document.querySelectorAll('#pm-list input[type=checkbox]');\n  var anyChecked = false, allChecked = true;\n  checks.forEach(function(c){ if (c.checked) anyChecked = true; else allChecked = false; });\n  var btn = document.getElementById('pm-consolidate-btn');\n  if (btn) btn.disabled = !anyChecked;\n  var all = document.getElementById('pm-all');\n  if (all) all.checked = allChecked && checks.length > 0;\n}\nfunction pmToggleAll(master) {\n  var checks = document.querySelectorAll('#pm-list input[type=checkbox]');\n  checks.forEach(function(c){\n    c.checked = master.checked;\n    var card = c.closest('.pm-card');\n    if (card) card.classList.toggle('selected', master.checked);\n  });\n  var btn = document.getElementById('pm-consolidate-btn');\n  if (btn) btn.disabled = !master.checked;\n}\nfunction pmTryAgain() {\n  // Reset selection and bounce back to details so they can refine the search\n  var checks = document.querySelectorAll('#pm-list input[type=checkbox], #pm-all');\n  checks.forEach(function(c){ c.checked = false; });\n  document.querySelectorAll('#pm-list .pm-card').forEach(function(c){ c.classList.remove('selected'); });\n  var btn = document.getElementById('pm-consolidate-btn');\n  if (btn) btn.disabled = true;\n  go('screen-add-emp-1');\n}\nfunction pmIgnore() {\n  go('screen-add-emp-2');\n}\nfunction pmConsolidate() {\n  var n = document.querySelectorAll('#pm-list input[type=checkbox]:checked').length;\n  empState.showDuplicatesMergedBanner = true;\n  empState.duplicatesResolved = true;\n  empState._pmMergedCount = n;\n  go('screen-add-emp-2');\n}\n\nfunction renderMatchState() {\n  var found = (window.tweakState && window.tweakState.matchFound !== false);\n  document.getElementById('match-found-state').style.display = found ? 'block' : 'none';\n  document.getElementById('match-none-state').style.display = found ? 'none' : 'block';\n  document.getElementById('match-title').textContent = found ? 'Is this one of these people?' : 'No matching records';\n  document.getElementById('match-sub').innerHTML = found\n    ? 'We found <strong id=\"match-count\">2<\u002Fstrong> existing records that closely match the details you entered. Picking the right one prevents duplicate records and keeps their history intact.'\n    : 'We searched existing records using their name, DOB and NI number. No close matches were found — we\\u2019ll create a fresh employee record.';\n}\n\nfunction addRoleRow() {\n  var list = document.getElementById('role-list');\n  var idx = list.children.length;\n  var row = document.createElement('div');\n  row.className = 'role-row';\n  row.setAttribute('data-role-idx', String(idx));\n  row.innerHTML =\n    '<div class=\"role-row-head\">' +\n      '<h5>Role ' + (idx + 1) + ' · Additional<\u002Fh5>' +\n      '<button type=\"button\" class=\"remove-role\" onclick=\"removeRoleRow(this)\">Remove<\u002Fbutton>' +\n    '<\u002Fdiv>' +\n    '<div class=\"form-grid-2\">' +\n      '<div class=\"field\"><label>Start date *<\u002Flabel><input type=\"text\" placeholder=\"DD/MM/YYYY\"><\u002Fdiv>' +\n      '<div class=\"field\"><label>Job title *<\u002Flabel><select><option>Select<\u002Foption><option>Driver<\u002Foption><option>Work Rider<\u002Foption><option>Yard Person<\u002Foption><option>Maintenance<\u002Foption><option>Other duties<\u002Foption><\u002Fselect><\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<div class=\"form-grid-2\">' +\n      '<div class=\"field\"><label>Employment type *<\u002Flabel><select><option>Casual<\u002Foption><option>Part time<\u002Foption><option>Full time<\u002Foption><\u002Fselect><\u002Fdiv>' +\n      '<div class=\"field\"><label>Employment terms *<\u002Flabel><select><option>Paid<\u002Foption><option>Unpaid<\u002Foption><\u002Fselect><\u002Fdiv>' +\n    '<\u002Fdiv>';\n  list.appendChild(row);\n  updateRoleCount();\n}\n\nfunction removeRoleRow(btn) {\n  btn.closest('.role-row').remove();\n  // re-number\n  var rows = document.querySelectorAll('#role-list .role-row');\n  rows.forEach(function(r, i) {\n    var h = r.querySelector('h5');\n    if (i === 0) {\n      h.textContent = 'Role 1 · Primary';\n      var btn = r.querySelector('.remove-role');\n      if (btn) btn.remove();\n    } else {\n      h.textContent = 'Role ' + (i + 1) + ' · Additional';\n    }\n  });\n  updateRoleCount();\n}\n\nfunction updateRoleCount() {\n  var n = document.querySelectorAll('#role-list .role-row').length;\n  var lbl = document.getElementById('role-count-label');\n  if (lbl) lbl.textContent = n + (n === 1 ? ' role' : ' roles');\n}\n\nfunction toggleHandoverChannel(which, checked) {\n  if (which === 'email') {\n    regState.handoverEmail = checked;\n    document.getElementById('handover-email').classList.toggle('checked', checked);\n  } else {\n    regState.handoverSms = checked;\n    document.getElementById('handover-sms').classList.toggle('checked', checked);\n  }\n}\n\n// ==================== MAGIC LINK PREVIEW (stable employee experience) ====================\nfunction finishHandover() {\n  document.getElementById('modal-handover-sent').classList.add('open');\n}\nfunction startMagicLinkPreview() {\n  go('screen-magic-email');\n}\nfunction goMagic(step) {\n  go('screen-magic-' + step);\n  window.scrollTo({top:0, behavior:'instant'});\n}\nfunction exitMagicPreview() {\n  submitAddEmployee();\n}\nfunction toggleMagicCheck(row, inputId) {\n  var input = document.getElementById(inputId);\n  if (!input) return;\n  input.checked = !input.checked;\n  row.classList.toggle('checked', input.checked);\n}\nfunction clearSig() {\n  var s = document.getElementById('magic-sig');\n  if (!s) return;\n  if (s.classList.contains('signed')) {\n    s.classList.remove('signed');\n    s.textContent = 'Tap to sign with your finger';\n    setTimeout(function(){ s.classList.add('signed'); s.textContent = 'Emma Harris'; }, 700);\n  }\n}\n\n// ==================== PROFILE TABS ====================\nfunction switchProfileTab(which) {\n  ['overview','roles','completed','available'].forEach(function(k) {\n    var tab = document.getElementById('ptab-' + k);\n    var pane = document.getElementById('ppane-' + k);\n    if (tab) tab.classList.toggle('active', k === which);\n    if (pane) pane.classList.toggle('active', k === which);\n  });\n}\n\n// ==================== TWEAKS PANEL ====================\nwindow.tweakState = { matchFound: true, photoResult: 'pass', multiRolePreset: false, otherTrainersPreset: false };\n\nfunction buildTweaksPanel() {\n  if (document.getElementById('tweaks-panel')) return;\n  var panel = document.createElement('div');\n  panel.id = 'tweaks-panel';\n  panel.innerHTML =\n    '<div class=\"tp-head\"><h4>Tweaks<\u002Fh4><button class=\"tp-close\" onclick=\"closeTweaks()\">✕<\u002Fbutton><\u002Fdiv>' +\n    '<div class=\"tp-body\">' +\n\n      '<div class=\"tp-section\">' +\n        '<div class=\"tp-label\">Registration path<\u002Fdiv>' +\n        '<div class=\"tp-seg\" id=\"tw-method\">' +\n          '<button class=\"active\" onclick=\"tw_setMethod(\\'trainer\\')\">Trainer fills<\u002Fbutton>' +\n          '<button onclick=\"tw_setMethod(\\'invite\\')\">Invite employee<\u002Fbutton>' +\n        '<\u002Fdiv>' +\n        '<div class=\"tp-note\">Switches which path the \"Get started\" step uses.<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n\n      '<div class=\"tp-section\">' +\n        '<div class=\"tp-label\">Pre-fill multiple roles<\u002Fdiv>' +\n        '<div class=\"tp-seg\" id=\"tw-roles\">' +\n          '<button class=\"active\" onclick=\"tw_setRoles(false)\">Single role<\u002Fbutton>' +\n          '<button onclick=\"tw_setRoles(true)\">Two roles<\u002Fbutton>' +\n        '<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n\n      '<div class=\"tp-section\">' +\n        '<div class=\"tp-label\">Profile training tab<\u002Fdiv>' +\n        '<div class=\"tp-seg\">' +\n          '<button onclick=\"tw_jumpProfile(\\'completed\\')\">Completed<\u002Fbutton>' +\n          '<button onclick=\"tw_jumpProfile(\\'available\\')\">Available<\u002Fbutton>' +\n        '<\u002Fdiv>' +\n        '<div class=\"tp-note\">Jumps the open profile to that tab.<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n\n      '<div class=\"tp-section\">' +\n        '<div class=\"tp-label\">Magic link preview (employee view)<\u002Fdiv>' +\n        '<button onclick=\"startMagicLinkPreview()\" style=\"width:100%;background:#1a2037;color:white;border:none;padding:8px;font-size:12px;font-weight:500;border-radius:5px;cursor:pointer;font-family:inherit;margin-bottom:6px\">Open Emma\\'s magic link flow →<\u002Fbutton>' +\n        '<div class=\"tp-note\">6 mobile-styled screens. Naturally triggered from the trainer Handover step.<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n\n      '<div class=\"tp-section\">' +\n        '<div class=\"tp-label\">Show digital race card<\u002Fdiv>' +\n        '<button onclick=\"openPassPanel(\\'Adam Browne\\',\\'48273\\')\" style=\"width:100%;background:#1a2037;color:white;border:none;padding:8px;font-size:12px;font-weight:500;border-radius:5px;cursor:pointer;font-family:inherit\">Open pass card panel<\u002Fbutton>' +\n      '<\u002Fdiv>' +\n\n    '<\u002Fdiv>';\n  document.body.appendChild(panel);\n}\n\nfunction tw_setSeg(containerId, idx) {\n  var c = document.getElementById(containerId);\n  if (!c) return;\n  var btns = c.querySelectorAll('button');\n  btns.forEach(function(b, i) { b.classList.toggle('active', i === idx); });\n}\nfunction tw_setMethod(v) {\n  tw_setSeg('tw-method', v === 'trainer' ? 0 : 1);\n  selectMethod(v);\n}\nfunction tw_setMatch(v) {\n  tw_setSeg('tw-match', v ? 0 : 1);\n  window.tweakState.matchFound = v;\n  renderMatchState();\n}\nfunction tw_setPhoto(v) {\n  tw_setSeg('tw-photo', v === 'pass' ? 0 : (v === 'fail' ? 1 : 2));\n  window.tweakState.photoResult = v;\n  // override the upload rotation\n  window.__idPhotoMode = (v === 'pass' ? 0 : (v === 'fail' ? 1 : 2));\n}\nfunction tw_setOther(v) {\n  tw_setSeg('tw-other', v ? 1 : 0);\n  window.tweakState.otherTrainersPreset = v;\n  var toggle = document.getElementById('other-trainer-toggle');\n  if (toggle) {\n    var btns = toggle.querySelectorAll('button');\n    var target = v ? btns[1] : btns[0];\n    if (target) toggleOtherTrainer(target, v);\n  }\n}\nfunction tw_setRoles(v) {\n  tw_setSeg('tw-roles', v ? 1 : 0);\n  window.tweakState.multiRolePreset = v;\n  var list = document.getElementById('role-list');\n  if (!list) return;\n  // Reset to just one row, then add second if needed\n  while (list.children.length > 1) list.lastChild.remove();\n  if (v) addRoleRow();\n}\nfunction tw_jumpProfile(tab) {\n  go('screen-emp-profile');\n  setTimeout(function(){ switchProfileTab(tab); }, 50);\n}\n\nfunction openTweaks() {\n  buildTweaksPanel();\n  document.getElementById('tweaks-panel').classList.add('open');\n}\nfunction closeTweaks() {\n  var p = document.getElementById('tweaks-panel');\n  if (p) p.classList.remove('open');\n  try { window.parent.postMessage({type:'__edit_mode_dismissed'}, '*'); } catch(e) {}\n}\n\n// Edit mode protocol — register listener BEFORE announcing\nwindow.addEventListener('message', function(e) {\n  if (!e || !e.data) return;\n  if (e.data.type === '__activate_edit_mode') openTweaks();\n  if (e.data.type === '__deactivate_edit_mode') {\n    var p = document.getElementById('tweaks-panel');\n    if (p) p.classList.remove('open');\n  }\n});\ntry { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(e) {}\n\nfunction submitUpdateEmp() {\n  empState.showUpdateBanner = true;\n  go('screen-emp-profile');\n  renderProfileBanners();\n}\n\nfunction submitReplacementPass() {\n  empState.showReplacementBanner = true;\n  go('screen-emp-profile');\n  renderProfileBanners();\n}\n\nfunction submitUpdatePhoto() {\n  empState.showPhotoUpdatedBanner = true;\n  empState.showPhotoRenewalWarning = false;\n  go('screen-emp-profile');\n  renderProfileBanners();\n}\n\nfunction openReinstateModal(name, ser) {\n  document.getElementById('reinstate-name').textContent = name;\n  document.getElementById('reinstate-ser').textContent = ser;\n  document.getElementById('modal-reinstate').classList.add('open');\n}\nfunction confirmReinstate() {\n  closeModal('modal-reinstate');\n  empState.showWelcomeBanner = true;\n  go('screen-employees');\n  renderEmpListBanners();\n}\n\nfunction exportEmployeesCsv() {\n  // Lightweight stub — in real product this would stream a CSV from the server.\n  var rows = [\n    ['SER','Name','Job title','Start date','Employment type','Employment terms','Pass expiry','Photo renewal'],\n    ['48273','Adam Browne','Other duties','13/07/2023','Full time','Unpaid','20/07/2026','20/07/2025'],\n    ['52301','Emily Hughes','Stable hand','08/01/2025','Full time','Paid','—','—'],\n    ['11939','James O\\'Connor','Head Lad','15/06/2018','Full time','Paid','22/07/2024','22/07/2024']\n  ];\n  var csv = rows.map(function(r){ return r.map(function(c){ return '\"'+String(c).replace(/\"/g,'\"\"')+'\"'; }).join(','); }).join('\\n');\n  var blob = new Blob([csv], {type:'text/csv'});\n  var url = URL.createObjectURL(blob);\n  var a = document.createElement('a');\n  a.href = url; a.download = 'stable-employees-'+new Date().toISOString().slice(0,10)+'.csv';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);\n}\n\nfunction submitTermination() {\n  empState.showTerminationBanner = true;\n  empState.passActive = false;\n  go('screen-employees');\n  // Auto-switch to past employees tab\n  empSubtab('past');\n  renderEmpListBanners();\n}\n\nfunction submitPassApplication() {\n  empState.showPassApplyBanner = true;\n  go('screen-emp-profile');\n  renderProfileBanners();\n}\n\n// ==================== ID PHOTO SMART CHECK ====================\nwindow.simulateIdPhotoUpload = function(forceMode) {\n  var modes = ['pass', 'fail'];\n  if (!forceMode) {\n    window.__idPhotoMode = (window.__idPhotoMode || 0);\n    forceMode = modes[window.__idPhotoMode % modes.length];\n    window.__idPhotoMode++;\n  }\n  showIdPhotoState('checking');\n  setTimeout(function() { showIdPhotoState(forceMode); }, 1400);\n};\nwindow.resetIdPhotoUpload = function() {\n  var input = document.getElementById('id-photo-file');\n  if (input) input.value = '';\n  showIdPhotoState('empty');\n};\nfunction showIdPhotoState(state) {\n  var ids = ['id-photo-empty','id-photo-checking','id-photo-pass','id-photo-fail','id-photo-match'];\n  var target = 'id-photo-' + state;\n  ids.forEach(function(id) {\n    var el = document.getElementById(id);\n    if (el) el.style.display = (id === target) ? '' : 'none';\n  });\n}\n\nfunction completePoolReturn() {\n  empState.showPoolBanner = true;\n  document.getElementById('pool-success-banner').innerHTML = '<div class=\"banner banner-success\"><div class=\"banner-left\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>Return completed for this quarter<\u002Fdiv><button class=\"banner-close\" onclick=\"document.getElementById(\\'pool-success-banner\\').innerHTML=\\'\\'\">✕<\u002Fbutton><\u002Fdiv>';\n}\n\nfunction empSwitchTab(tab) {\n  var tabEmp = document.getElementById('emp-tab-employees');\n  var tabPool = document.getElementById('emp-tab-pool');\n  if (tabEmp && tabPool) {\n    if (tab === 'pool') {\n      tabEmp.style.color = 'rgba(255,255,255,0.5)';\n      tabEmp.style.borderBottom = '3px solid transparent';\n      tabPool.style.color = 'white';\n      tabPool.style.borderBottom = '3px solid #ed174d';\n    } else {\n      tabEmp.style.color = 'white';\n      tabEmp.style.borderBottom = '3px solid #ed174d';\n      tabPool.style.color = 'rgba(255,255,255,0.5)';\n      tabPool.style.borderBottom = '3px solid transparent';\n    }\n  }\n  // Inner card tabs (always visible)\n  var innerEmp = document.getElementById('inner-tab-employees');\n  var innerPool = document.getElementById('inner-tab-pool2');\n  if (innerEmp && innerPool) {\n    if (tab === 'pool') {\n      innerEmp.style.color = '#989faa';\n      innerEmp.style.fontWeight = '500';\n      innerEmp.style.borderBottom = '3px solid transparent';\n      innerPool.style.color = '#1a2037';\n      innerPool.style.fontWeight = '600';\n      innerPool.style.borderBottom = '3px solid #ed174d';\n    } else {\n      innerEmp.style.color = '#1a2037';\n      innerEmp.style.fontWeight = '600';\n      innerEmp.style.borderBottom = '3px solid #ed174d';\n      innerPool.style.color = '#989faa';\n      innerPool.style.fontWeight = '500';\n      innerPool.style.borderBottom = '3px solid transparent';\n    }\n  }\n  if (tab === 'pool') {\n    document.getElementById('employees-tab-content').style.display = 'none';\n    document.getElementById('pool-tab-content').style.display = 'block';\n  } else {\n    document.getElementById('employees-tab-content').style.display = 'block';\n    document.getElementById('pool-tab-content').style.display = 'none';\n  }\n}\n\nfunction empSubtab(which) {\n  var pills = { current: document.getElementById('pill-current'), past: document.getElementById('pill-past'), pending: document.getElementById('pill-pending') };\n  Object.keys(pills).forEach(function(k) {\n    var p = pills[k];\n    if (!p) return;\n    if (k === which) {\n      p.style.background = '#0d101c';\n      p.style.color = 'white';\n      p.style.fontWeight = '600';\n      // count badge stays its red\n    } else {\n      p.style.background = '#e0e4e8';\n      p.style.color = '#1a2037';\n      p.style.fontWeight = '500';\n    }\n  });\n  document.getElementById('current-emp-table').style.display = which === 'current' ? '' : 'none';\n  document.getElementById('past-emp-table').style.display = which === 'past' ? '' : 'none';\n  var pendingTbl = document.getElementById('pending-emp-table');\n  if (pendingTbl) pendingTbl.style.display = which === 'pending' ? '' : 'none';\n}\n\nfunction empInnerTab(tab) {\n  // No-op — already on employees tab\n}\n\nfunction openPassPanel(name, ser) {\n  document.getElementById('pass-name').textContent = name;\n  document.getElementById('pass-ser').textContent = 'SER · ' + ser;\n  // Format SER as spaced digits for barcode label\n  var barcodeText = 'SER ' + String(ser).split('').join(' ') + ' — UK';\n  var barcodeEl = document.getElementById('pass-barcode-num');\n  if (barcodeEl) barcodeEl.textContent = barcodeText;\n  document.getElementById('pass-overlay').classList.add('open');\n  document.getElementById('pass-panel').classList.add('open');\n}\nfunction closePassPanel() {\n  document.getElementById('pass-overlay').classList.remove('open');\n  document.getElementById('pass-panel').classList.remove('open');\n}\nfunction fakeWallet(which) {\n  var label = which === 'apple' ? 'Apple Wallet' : 'Google Wallet';\n  alert('Pass added to ' + label + ' (demo). In the live product this would launch the platform\\u2019s wallet handler.');\n}\nfunction fakeDownload() {\n  alert('Downloading pass card as PDF\\u2026 (demo)');\n}\n\n// ===== Top nav dropdown menus (click to open, click outside / Escape to close) =====\n(function() {\n  var navItems = document.querySelectorAll('.nav-item');\n  navItems.forEach(function(item) {\n    var trigger = item.querySelector('.nav-trigger');\n    if (!trigger) return;\n    trigger.addEventListener('click', function(e) {\n      e.stopPropagation();\n      var wasOpen = item.classList.contains('open');\n      navItems.forEach(function(it) { it.classList.remove('open'); });\n      if (!wasOpen) item.classList.add('open');\n    });\n  });\n  document.addEventListener('click', function(e) {\n    if (!e.target.closest('.nav-item')) {\n      navItems.forEach(function(it) { it.classList.remove('open'); });\n    }\n    if (!e.target.closest('.viewing-as-wrap')) {\n      var w = document.querySelector('.viewing-as-wrap');\n      if (w) w.classList.remove('open');\n    }\n  });\n  document.addEventListener('keydown', function(e) {\n    if (e.key === 'Escape') {\n      navItems.forEach(function(it) { it.classList.remove('open'); });\n      var w = document.querySelector('.viewing-as-wrap');\n      if (w) w.classList.remove('open');\n    }\n  });\n})();\n\nfunction toggleViewingAs(e) {\n  e.stopPropagation();\n  document.querySelector('.viewing-as-wrap').classList.toggle('open');\n}\nfunction setViewingAs(name, role) {\n  document.getElementById('viewing-as-current').textContent = name;\n  document.querySelectorAll('.viewing-as-option').forEach(function(o) { o.classList.remove('active'); });\n  event.currentTarget.classList.add('active');\n  document.querySelector('.viewing-as-wrap').classList.remove('open');\n  document.body.setAttribute('data-viewing-role', role || '');\n  document.body.setAttribute('data-viewing-name', name || '');\n  applyViewingProfile(name);\n  renderNotifications(name);\n}\n\n// ==================== NOTIFICATIONS ====================\nvar NOTIFICATIONS_BY_NAME = {\n  'default': [\n    { type: 'success', source: 'Racing Digital', time: '5 mins ago',\n      title: 'Name approved: “Swift Justice” is now registered.' },\n    { type: 'error', source: 'BHA', time: '1 hour ago',\n      title: 'Two employee passes have expired — action required.' },\n    { type: 'info', source: 'Racing Digital', time: 'Yesterday',\n      title: 'Pool winnings statement available for download.' }\n  ]\n};\nfunction renderNotifications(name) {\n  var list = (NOTIFICATIONS_BY_NAME[name] || NOTIFICATIONS_BY_NAME['default']).slice();\n  // Filter out any the user dismissed in this session\n  list = list.filter(function(_, i) { return !dismissedNotifs[(name || 'default') + ':' + i]; });\n  var el = document.getElementById('notifications-list');\n  if (!el) return;\n  var badge = document.querySelector('#nav-bell .nav-badge');\n  if (badge) {\n    if (list.length) { badge.textContent = String(list.length); badge.style.display = ''; }\n    else { badge.style.display = 'none'; }\n  }\n  if (!list.length) {\n    el.innerHTML = '<div style=\"padding:32px 20px;text-align:center;font-size:12px;color:#9aa1ad\">You’re all caught up.<\u002Fdiv>';\n    return;\n  }\n  el.innerHTML = list.map(function(n, i) {\n    var type = n.type || 'info';\n    if (type === 'reminder') type = 'info';\n    var icon;\n    if (type === 'error') {\n      icon = '<svg viewBox=\"0 0 24 24\" style=\"width:20px;height:20px\"><path fill=\"#dc2949\" d=\"M12 3 1 21h22L12 3z\"/><path fill=\"#fde7eb\" d=\"M11 10h2v5h-2v-5zm0 6h2v2h-2v-2z\"/><\u002Fsvg>';\n    } else if (type === 'success') {\n      icon = '<svg viewBox=\"0 0 24 24\" style=\"width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round\"><polyline points=\"5 12 10 17 19 7\"/><\u002Fsvg>';\n    } else {\n      icon = '<svg viewBox=\"0 0 24 24\" style=\"width:14px;height:14px;fill:#fff;stroke:none\"><path d=\"M11 7h2v2h-2V7zm0 4h2v6h-2v-6z\"/><\u002Fsvg>';\n    }\n    var btn = n.action ? '<button type=\"button\" style=\"margin-top:10px;background:#0d101c;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer\">' + n.action + '<\u002Fbutton>' : '';\n    return '<div class=\"notif notif-' + type + '\" data-notif-idx=\"' + i + '\">' +\n        '<span class=\"notif-icon\">' + icon + '<\u002Fspan>' +\n        '<div class=\"notif-body\">' +\n          '<div class=\"notif-head\">' +\n            '<span class=\"notif-source\">' + n.source + '<\u002Fspan>' +\n            '<span class=\"notif-time\">' + n.time + '<\u002Fspan>' +\n          '<\u002Fdiv>' +\n          '<div class=\"notif-title\">' + n.title + '<\u002Fdiv>' +\n          btn +\n        '<\u002Fdiv>' +\n        '<button type=\"button\" class=\"notif-close\" onclick=\"dismissNotification(event, ' + i + ')\" aria-label=\"Dismiss\">' +\n          '<svg viewBox=\"0 0 24 24\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><\u002Fsvg>' +\n        '<\u002Fbutton>' +\n      '<\u002Fdiv>';\n  }).join('');\n}\n\nvar dismissedNotifs = {};\nfunction dismissNotification(e, idx) {\n  if (e) { e.stopPropagation(); e.preventDefault(); }\n  var name = document.body.getAttribute('data-viewing-name') || 'default';\n  dismissedNotifs[name + ':' + idx] = true;\n  renderNotifications(name);\n}\nfunction toggleNotifications(e) {\n  if (e) e.stopPropagation();\n  var p = document.getElementById('notifications-panel');\n  if (!p) return;\n  p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';\n}\ndocument.addEventListener('click', function(e) {\n  var p = document.getElementById('notifications-panel');\n  var bell = document.getElementById('nav-bell');\n  if (p && p.style.display === 'block' && bell && !bell.contains(e.target)) {\n    p.style.display = 'none';\n  }\n});\ndocument.addEventListener('DOMContentLoaded', function() {\n  renderNotifications(document.body.getAttribute('data-viewing-name') || 'default');\n});\n\n// Trainer-view employee profile defaults (Adam Browne).\nvar adamProfileData = {\n  name: 'Adam Browne',\n  ser: '48273',\n  initials: 'AB',\n  photoColor: '#dbeafe',\n  photoTextColor: '#1e40af',\n  photoRenewal: '20/07/2025',\n  passStatus: 'Yes',\n  current: {\n    startDate: '13/07/2023',\n    jobTitle: 'Other duties',\n    employmentType: 'Full time',\n    employmentTerms: 'Unpaid',\n    endDate: '—'\n  },\n  history: [\n    { role: 'Other duties', terms: 'Full time, Unpaid', range: '13/07/2023 – present' },\n    { role: 'Stable hand', terms: 'Part time, Salaried', range: '10/01/2022 – 12/07/2023' }\n  ],\n  details: {\n    title: 'Mr', forename: 'Adam', surname: 'Browne',\n    dob: '12/12/2005', sex: 'Male', nationality: 'British', ni: 'AB123456C',\n    pension: null\n  },\n  contact: {\n    phone: '07700 900123',\n    email: 'adam.browne@example.com',\n    address: '14 Stable Lane,<br>Newmarket, CB8 7XX'\n  },\n  nextOfKin: {\n    name: 'Margaret Browne',\n    phone: '07700 900456',\n    email: 'm.browne@example.com'\n  }\n};\n\nfunction applyViewingProfile(name) {\n  var p = adamProfileData;\n  // Header card\n  var nameEl = document.getElementById('profile-card-name');\n  var serEl = document.getElementById('profile-card-ser');\n  var photoEl = document.getElementById('profile-card-photo');\n  var renewalEl = document.getElementById('profile-card-renewal');\n  if (nameEl) nameEl.textContent = p.name;\n  if (serEl) serEl.textContent = p.ser;\n  if (photoEl) {\n    photoEl.textContent = p.initials;\n    photoEl.style.background = p.photoColor;\n    photoEl.style.color = p.photoTextColor;\n  }\n  if (renewalEl) renewalEl.textContent = p.photoRenewal;\n  // Current employment\n  setText('pf-cur-start', p.current.startDate);\n  setText('pf-cur-job', p.current.jobTitle);\n  setText('pf-cur-type', p.current.employmentType);\n  setText('pf-cur-terms', p.current.employmentTerms);\n  setText('pf-cur-end', p.current.endDate);\n  // History\n  var histEl = document.getElementById('pf-history');\n  if (histEl) {\n    histEl.innerHTML = p.history.map(function(h) {\n      return '<div class=\"profile-row\"><span class=\"lbl\">' + h.role + ' · ' + h.terms + '<\u002Fspan><span class=\"val\">' + h.range + '<\u002Fspan><\u002Fdiv>';\n    }).join('');\n  }\n  // Details\n  setText('pf-d-title', p.details.title);\n  setText('pf-d-fore', p.details.forename);\n  setText('pf-d-sur', p.details.surname);\n  setText('pf-d-dob', p.details.dob);\n  setText('pf-d-sex', p.details.sex);\n  setText('pf-d-nat', p.details.nationality);\n  setText('pf-d-ni', p.details.ni);\n  var pensionRow = document.getElementById('pf-d-pension-row');\n  if (pensionRow) {\n    if (p.details.pension) {\n      pensionRow.style.display = '';\n      setText('pf-d-pension', p.details.pension);\n    } else {\n      pensionRow.style.display = 'none';\n    }\n  }\n  // Contact\n  setText('pf-c-phone', p.contact.phone);\n  setText('pf-c-email', p.contact.email);\n  var addr = document.getElementById('pf-c-address');\n  if (addr) addr.innerHTML = p.contact.address;\n  // Next of kin\n  setText('pf-k-name', p.nextOfKin.name);\n  setText('pf-k-phone', p.nextOfKin.phone);\n  setText('pf-k-email', p.nextOfKin.email);\n}\n\nfunction setText(id, txt) {\n  var el = document.getElementById(id);\n  if (el) el.textContent = txt;\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
